<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>e-Expedition — Campeonatos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #07080A;
    --bg-soft: #0C0D10;
    --surface: rgba(22, 24, 28, 0.72);
    --surface-solid: #14161A;
    --surface-2: rgba(32, 35, 42, 0.85);
    --border: rgba(255,255,255,0.08);
    --border-strong: rgba(255,255,255,0.14);
    --text: #F4F5F7;
    --muted: #9A9DA6;
    --gold: #C6FF1A;
    --gold-2: #DFFF66;
    --violet: #1E1F22;
    --violet-2: #C6FF1A;
    --win: #C6FF1A;
    --loss: #FF4D5E;
    --radius: 16px;
    --radius-sm: 12px;
    --shadow: 0 8px 32px rgba(0,0,0,.35);
    --shadow-soft: 0 4px 20px rgba(0,0,0,.2);
    --glass: blur(16px) saturate(1.2);
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;overflow-x:hidden;}
  body{
    margin:0;color:var(--text);font-family:'Manrope',sans-serif;line-height:1.55;font-size:15px;
    background-color:var(--bg);
    background-image:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(198,255,26,.07), transparent 55%),
      radial-gradient(ellipse 60% 40% at 100% 0%, rgba(80,120,255,.05), transparent 45%),
      linear-gradient(rgba(7,8,10,.88), rgba(7,8,10,.94)),
      url('fundo-hero.jpg');
    background-size: auto, auto, cover, cover;
    background-position: center, center, center, center;
    background-repeat: no-repeat, no-repeat, no-repeat, no-repeat;
    background-attachment: fixed, fixed, fixed, fixed;
    min-height:100vh;
  }
  h1,h2,h3,.display{font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:0.15px;line-height:1.15;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  ::-webkit-scrollbar{height:6px;width:6px;}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:99px;}
  ::-webkit-scrollbar-track{background:transparent;}

  .card h3,.card-body h3,.match .slot .name,.podium-spot .nome,
  .detail-banner h1,.hero h1,.section-title h1{
    overflow-wrap:anywhere;word-break:break-word;hyphens:auto;
  }
  .card-body,.form-box,.match .slot{min-width:0;}
  .match .slot .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0;}
  .podium-spot .nome{overflow-wrap:anywhere;word-break:break-word;line-height:1.2;}
  td,th{overflow-wrap:anywhere;}

  .shell{max-width:1120px;margin:0 auto;padding:0 clamp(16px,4vw,28px) 64px;}
  .topbar{
    display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
    padding:16px 0 18px;margin-bottom:clamp(18px,3vw,28px);
    position:sticky;top:0;z-index:40;
    background:linear-gradient(to bottom, rgba(7,8,10,.92) 60%, transparent);
    backdrop-filter:blur(12px);
  }
  .brand{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;}
  .brand .mark{
    width:34px;height:34px;border-radius:10px;flex-shrink:0;
    background:linear-gradient(145deg,var(--gold-2),var(--gold) 60%,#9AD400);
    display:flex;align-items:center;justify-content:center;
    font-family:'Barlow Condensed',sans-serif;font-weight:800;color:#0A0A0A;font-size:17px;
    box-shadow:0 4px 18px rgba(198,255,26,.28);
  }
  .brand .word{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:18px;letter-spacing:0.8px;white-space:nowrap;text-transform:uppercase;opacity:.95;}

  nav{
    display:flex;gap:2px;background:rgba(255,255,255,.04);padding:4px;border-radius:999px;border:1px solid var(--border);
    overflow-x:auto;scrollbar-width:none;order:3;flex:1 1 100%;
    backdrop-filter:var(--glass);
  }
  nav::-webkit-scrollbar{display:none;}
  nav button{
    background:transparent;border:none;color:var(--muted);padding:8px 16px;border-radius:999px;
    font-size:13px;font-weight:650;white-space:nowrap;transition:.2s ease;letter-spacing:.2px;
  }
  nav button:hover{color:var(--text);background:rgba(255,255,255,.05);}
  nav button.active{background:rgba(198,255,26,.14);color:var(--gold);font-weight:750;}

  .session{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--muted);order:2;margin-left:auto;}
  .session b{color:var(--text);}
  .session .user-chip{display:flex;align-items:center;gap:8px;min-width:0;}
  .session .user-chip b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:140px;}

  .btn{
    border:none;border-radius:999px;padding:10px 18px;font-weight:700;font-size:13.5px;
    transition:.2s ease;letter-spacing:.2px;
  }
  .btn-gold{
    background:linear-gradient(135deg,var(--gold-2),var(--gold));color:#0A0A0A;
    box-shadow:0 4px 16px rgba(198,255,26,.22);
  }
  .btn-gold:hover{filter:brightness(1.08);transform:translateY(-1px);box-shadow:0 6px 22px rgba(198,255,26,.32);}
  .btn-ghost{
    background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--text);
  }
  .btn-ghost:hover{background:rgba(255,255,255,.08);border-color:var(--border-strong);}
  .btn-danger{background:rgba(255,77,94,.08);border:1px solid rgba(255,77,94,.35);color:var(--loss);}
  .btn-danger:hover{background:rgba(255,77,94,.15);}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none !important;filter:none !important;}

  .hero{padding:clamp(16px,4vw,28px) 0 clamp(12px,2vw,20px);}
  .hero h1{font-size:clamp(32px,6vw,52px);line-height:1.02;margin:0 0 12px;
    background:linear-gradient(135deg,var(--text) 35%,var(--gold-2));
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  .hero p{color:var(--muted);max-width:520px;font-size:clamp(14px,2vw,15.5px);margin:0;line-height:1.6;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(270px,100%),1fr));gap:clamp(14px,2.5vw,20px);}
  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:0;transition:.25s ease;overflow:hidden;
    backdrop-filter:var(--glass);box-shadow:var(--shadow-soft);
  }
  .card:hover{
    transform:translateY(-4px);
    box-shadow:0 16px 40px rgba(0,0,0,.4), 0 0 0 1px rgba(198,255,26,.18);
    border-color:rgba(198,255,26,.22);
  }
  .card h3{margin:0 0 6px;font-size:21px;line-height:1.2;overflow-wrap:anywhere;font-weight:750;}
  .tag{
    display:inline-block;font-size:10.5px;font-weight:800;color:#0A0A0A;background:var(--gold);
    padding:4px 10px;border-radius:999px;margin-bottom:10px;letter-spacing:.5px;text-transform:uppercase;
  }
  .tag.status-aberto{background:var(--gold);}
  .tag.status-andamento{background:#FFB020;color:#1A1000;}
  .tag.status-finalizado{background:rgba(255,255,255,.14);color:var(--text);}
  .muted{color:var(--muted);font-size:13.5px;line-height:1.45;}
  .card .row{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:10px;flex-wrap:wrap;}
  .card-body{padding:16px 18px 18px;}

  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;font-weight:600;letter-spacing:.2px;}
  .field input,.field select,textarea{
    width:100%;background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--text);
    padding:11px 14px;border-radius:var(--radius-sm);font-size:14.5px;transition:.2s;
  }
  .field input:focus,.field select:focus,textarea:focus{border-color:rgba(198,255,26,.45);background:rgba(255,255,255,.06);}
  .form-box{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:18px 20px;flex:1 1 280px;max-width:100%;
    backdrop-filter:var(--glass);box-shadow:var(--shadow-soft);
  }
  .form-row{display:flex;gap:16px;flex-wrap:wrap;}
  .form-row .form-box{max-width:420px;}

  /* layout compacto / agrupado */
  .layout-grid{
    display:grid;
    grid-template-columns:repeat(2, minmax(0, 1fr));
    gap:16px;
    align-items:start;
    margin-bottom:16px;
  }
  .layout-grid .form-box,
  .layout-grid .card{margin:0 !important;max-width:none;width:100%;}
  .layout-stack{display:flex;flex-direction:column;gap:16px;max-width:920px;}
  .section-title{margin:0 0 14px;}
  .field{margin-bottom:12px;}
  @media (max-width:800px){
    .layout-grid{grid-template-columns:1fr;}
  }


  .bracket{display:flex;gap:clamp(18px,3vw,34px);overflow-x:auto;padding:12px 2px 24px;-webkit-overflow-scrolling:touch;}
  .round-col{display:flex;flex-direction:column;justify-content:space-around;min-width:200px;gap:20px;}
  .round-title{font-family:'Barlow Condensed',sans-serif;font-weight:700;color:var(--muted);font-size:14px;margin-bottom:6px;letter-spacing:.4px;text-transform:uppercase;}
  .match{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);
    overflow:hidden;transition:.2s;backdrop-filter:var(--glass);
  }
  .match:hover{border-color:var(--border-strong);}
  .match .slot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;font-size:13.5px;border-bottom:1px solid var(--border);}
  .match .slot:last-child{border-bottom:none;}
  .match .slot.win{color:var(--win);font-weight:700;}
  .match .slot.bye{color:var(--muted);font-style:italic;}
  .match .slot input{width:38px;background:rgba(0,0,0,.25);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:4px;font-size:13px;text-align:center;}

  .table-wrap{
    overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);
    background:var(--surface);backdrop-filter:var(--glass);
  }
  table{width:100%;border-collapse:collapse;min-width:420px;}
  th,td{text-align:left;padding:12px 16px;border-bottom:1px solid var(--border);font-size:14px;white-space:nowrap;}
  th{color:var(--muted);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.45px;}
  tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:rgba(255,255,255,.03);}

  .hero-banner{
    position:relative;overflow:hidden;
    border-radius:var(--radius);
    padding:clamp(28px,5.5vw,48px) clamp(20px,4vw,36px);
    background:
      radial-gradient(ellipse 70% 80% at 90% 20%, rgba(198,255,26,.14), transparent 50%),
      radial-gradient(ellipse 50% 60% at 10% 90%, rgba(40,60,20,.3), transparent 55%),
      linear-gradient(135deg, rgba(18,22,14,.9) 0%, rgba(12,14,12,.85) 50%, rgba(16,22,12,.9) 100%);
    border:1px solid var(--border);
    margin-bottom:clamp(22px,4vw,32px);
    box-shadow:var(--shadow-soft);
    backdrop-filter:var(--glass);
  }
  .hero-banner .inner{position:relative;z-index:1;}
  .hero-banner h1{
    color:#fff;-webkit-text-fill-color:#fff;background:none;
    font-size:clamp(30px,5.5vw,48px);margin:0 0 12px;line-height:1.05;font-weight:750;
  }
  .hero-banner p{color:rgba(255,255,255,.72);max-width:520px;font-size:clamp(14px,2vw,15.5px);margin:0 0 22px;line-height:1.55;}
  .hero-stats{display:flex;gap:clamp(16px,3.5vw,28px);flex-wrap:wrap;}
  .hero-stats .stat{
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);
    border-radius:14px;padding:12px 16px;min-width:88px;
  }
  .hero-stats .stat b{display:block;font-family:'Barlow Condensed',sans-serif;font-size:28px;color:#fff;line-height:1;font-weight:750;}
  .hero-stats .stat span{font-size:11px;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:.4px;margin-top:4px;display:block;}

  .banner{
    height:96px;position:relative;display:flex;align-items:flex-end;justify-content:flex-end;
    padding:12px 14px;overflow:hidden;
  }
  .banner::after{content:'';position:absolute;inset:0;background-image:
    radial-gradient(circle at 15% 120%, rgba(255,255,255,.18), transparent 50%),
    radial-gradient(circle at 95% -10%, rgba(255,255,255,.12), transparent 40%);
    opacity:.9;}
  .banner .game-icon{
    position:relative;width:44px;height:44px;border-radius:12px;
    background:rgba(255,255,255,.16);backdrop-filter:blur(6px);
    display:flex;align-items:center;justify-content:center;
    font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:15px;color:#fff;
    letter-spacing:0.4px;box-shadow:0 4px 12px rgba(0,0,0,.2);
    border:1px solid rgba(255,255,255,.12);
  }
  .banner-sm{height:56px;}
  .banner-sm .game-icon{width:32px;height:32px;font-size:12px;border-radius:9px;}

  .detail-banner{
    position:relative;overflow:hidden;border-radius:var(--radius);
    padding:26px clamp(18px,4vw,32px);margin-bottom:22px;color:#fff;
    box-shadow:var(--shadow-soft);border:1px solid rgba(255,255,255,.1);
  }
  .detail-banner::after{content:'';position:absolute;inset:0;background-image:
    radial-gradient(circle at 92% -5%, rgba(255,255,255,.18), transparent 42%),
    radial-gradient(circle at 5% 110%, rgba(0,0,0,.25), transparent 50%);}
  .detail-banner .inner{position:relative;z-index:1;}
  .detail-banner .tag{background:rgba(255,255,255,.2);color:#fff;}
  .detail-banner h1{color:#fff;-webkit-text-fill-color:#fff;background:none;font-size:clamp(26px,5vw,40px);margin:6px 0;line-height:1.1;}
  .detail-banner .muted{color:rgba(255,255,255,.78);}
  .detail-banner .game-icon-lg{
    position:absolute;right:20px;bottom:16px;width:64px;height:64px;border-radius:16px;
    background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;
    font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:22px;color:#fff;
    letter-spacing:.8px;border:1px solid rgba(255,255,255,.12);
  }

  .avatar,.avatar-img{
    width:32px;height:32px;border-radius:50%;object-fit:cover;flex-shrink:0;
    background:var(--surface-solid);border:2px solid rgba(255,255,255,.12);
  }
  .avatar-initials{
    width:32px;height:32px;border-radius:50%;flex-shrink:0;
    background:linear-gradient(145deg,var(--gold-2),var(--gold));
    color:#0A0A0A;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:13px;
    display:inline-flex;align-items:center;justify-content:center;letter-spacing:0.3px;
    border:2px solid transparent;
  }
  .avatar-lg,.avatar-img.avatar-lg{width:76px;height:76px;border-width:3px;}
  .avatar-initials.avatar-lg{width:76px;height:76px;font-size:26px;}

  .empty{
    padding:48px 24px;text-align:center;color:var(--muted);
    border:1px dashed var(--border-strong);border-radius:var(--radius);
    background:rgba(255,255,255,.02);
  }

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(8px);
    background:rgba(22,24,28,.94);border:1px solid var(--border-strong);
    padding:12px 20px;border-radius:999px;font-size:13.5px;font-weight:600;
    box-shadow:0 12px 40px rgba(0,0,0,.45);opacity:0;pointer-events:none;
    transition:opacity .25s, transform .25s;max-width:calc(100vw - 32px);text-align:center;
    backdrop-filter:blur(12px);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .section-title{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin:4px 0 18px;flex-wrap:wrap;}
  .section-title h1{letter-spacing:.2px;}
  .tabs-inline{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
  .tabs-inline button{
    background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--muted);
    padding:7px 14px;border-radius:999px;font-size:13px;font-weight:600;transition:.2s;
  }
  .tabs-inline button:hover{color:var(--text);border-color:var(--border-strong);}
  .tabs-inline button.active{background:var(--gold);color:#0A0A0A;border-color:var(--gold);font-weight:800;}

  .player-list{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;}
  .player-chip{
    display:inline-flex;align-items:center;gap:8px;
    background:rgba(255,255,255,.05);border:1px solid var(--border);
    border-radius:999px;padding:5px 12px 5px 5px;
    font-size:13.5px;font-weight:600;color:var(--text);
    transition:transform .2s ease, border-color .2s ease, background .2s ease;
  }
  .player-chip:hover{
    transform:translateY(-2px);
    border-color:rgba(198,255,26,.3);
    background:rgba(198,255,26,.06);
  }
  .player-chip .avatar-img,
  .player-chip .avatar-initials{
    width:28px;height:28px;font-size:11px;border-width:1.5px;
  }
  .home-filters{
    display:flex;gap:6px;flex-wrap:wrap;margin:0 0 18px;
    background:rgba(255,255,255,.03);border:1px solid var(--border);
    border-radius:999px;padding:4px;width:fit-content;max-width:100%;
  }
  .home-filters button{
    background:transparent;border:none;color:var(--muted);
    padding:8px 14px;border-radius:999px;font-size:13px;font-weight:650;
    cursor:pointer;transition:.2s ease;white-space:nowrap;
  }
  .home-filters button:hover{color:var(--text);}
  .home-filters button.active{
    background:rgba(198,255,26,.14);color:var(--gold);font-weight:750;
  }
  .home-filters .count{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:18px;height:18px;padding:0 5px;margin-left:4px;
    border-radius:99px;font-size:11px;font-weight:800;
    background:rgba(255,255,255,.08);color:var(--muted);
  }
  .home-filters button.active .count{
    background:rgba(198,255,26,.25);color:var(--gold);
  }


  @keyframes cardIn{ from{opacity:0;transform:translateY(12px);} to{opacity:1;transform:translateY(0);} }
  .card{animation:cardIn .4s ease both;}
  @keyframes fadeUp{ from{opacity:0;transform:translateY(8px);} to{opacity:1;transform:translateY(0);} }
  .hero-banner,.detail-banner{animation:fadeUp .45s ease both;}

  .ticker-wrap{
    overflow:hidden;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:999px;
    margin:0 0 clamp(16px,3vw,24px);padding:8px 0;white-space:nowrap;display:none;
    backdrop-filter:var(--glass);
  }
  .ticker-track{display:inline-flex;gap:32px;animation:ticker-scroll 26s linear infinite;padding-left:20px;}
  .ticker-wrap:hover .ticker-track{animation-play-state:paused;}
  .ticker-track span.ticker-item{font-size:12px;font-weight:700;color:var(--gold);letter-spacing:.25px;display:inline-flex;align-items:center;gap:8px;}
  .ticker-track span.ticker-dot{color:rgba(255,255,255,.2);}
  @keyframes ticker-scroll{ from{transform:translateX(0);} to{transform:translateX(-50%);} }

  .pair{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:20px;}
  .pair::after{
    content:'';position:absolute;right:-16px;top:36px;bottom:36px;width:16px;
    border-top:1.5px solid rgba(198,255,26,.3);border-bottom:1.5px solid rgba(198,255,26,.3);
    border-right:1.5px solid rgba(198,255,26,.3);border-radius:0 8px 8px 0;
  }
  .match.decidido{box-shadow:inset 0 0 0 1px rgba(198,255,26,.25);}

  .podium{display:flex;align-items:flex-end;gap:14px;margin-bottom:28px;}
  .podium-spot{
    flex:1;min-width:0;background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius);padding:18px 14px;text-align:center;position:relative;
    animation:fadeUp .45s ease both;backdrop-filter:var(--glass);
  }
  .podium-spot .medal{
    width:38px;height:38px;border-radius:50%;margin:0 auto 10px;
    display:flex;align-items:center;justify-content:center;
    font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:16px;color:#0A0A0A;
  }
  .podium-spot.first .medal{background:linear-gradient(145deg,#FFE566,#C8A800);box-shadow:0 4px 14px rgba(200,168,0,.35);}
  .podium-spot.second .medal{background:linear-gradient(145deg,#EEF1F5,#A4ACB4);box-shadow:0 4px 14px rgba(160,168,176,.25);}
  .podium-spot.third .medal{background:linear-gradient(145deg,#ECAA7A,#B06A30);box-shadow:0 4px 14px rgba(176,106,48,.28);}
  .podium-spot .nome{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:17px;line-height:1.2;}
  .podium-spot .vit{color:var(--gold);font-weight:800;font-size:12.5px;margin-top:6px;}
  .podium-spot.first{padding-top:28px;border-color:rgba(198,255,26,.28);box-shadow:0 0 0 1px rgba(198,255,26,.12),var(--shadow-soft);order:2;}
  .podium-spot.second{order:1;padding-top:14px;}
  .podium-spot.third{order:3;padding-top:10px;}

  .nivel-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px;text-transform:uppercase;letter-spacing:.3px;}
  .nivel-bronze{background:rgba(240,178,122,.12);color:#F0B27A;}
  .nivel-prata{background:rgba(216,220,226,.1);color:#D8DCE2;}
  .nivel-ouro{background:rgba(255,224,102,.12);color:#FFE066;}
  .nivel-diamante{background:rgba(102,240,255,.1);color:#66F0FF;}

  @media (max-width:640px){
    .topbar{gap:10px;padding:12px 0 14px;}
    .brand{order:1;}
    .session{order:2;margin-left:0;width:auto;}
    nav{order:3;}
    .btn{padding:9px 14px;font-size:13px;}
    .card-body{padding:14px 15px 16px;}
    .form-box{padding:18px;}
    .session .user-chip b{max-width:90px;}
    .hero-banner{border-radius:14px;padding:24px 18px;}
    .podium{gap:10px;}
  }

  /* ---- admin panel ---- */
  .admin-nav{
    display:flex;gap:6px;flex-wrap:wrap;margin-bottom:22px;
    background:rgba(255,255,255,.03);border:1px solid var(--border);
    border-radius:999px;padding:5px;width:fit-content;max-width:100%;
  }
  .admin-nav button{
    background:transparent;border:none;color:var(--muted);padding:8px 16px;
    border-radius:999px;font-size:13px;font-weight:650;cursor:pointer;transition:.2s;
  }
  .admin-nav button:hover{color:var(--text);}
  .admin-nav button.active{background:rgba(198,255,26,.14);color:var(--gold);font-weight:750;}

  .admin-stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:22px;}
  .admin-stat{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);
    padding:14px 18px;min-width:110px;backdrop-filter:var(--glass);
  }
  .admin-stat b{display:block;font-family:'Barlow Condensed',sans-serif;font-size:26px;line-height:1;font-weight:750;}
  .admin-stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}

  .wizard-steps{display:flex;align-items:center;gap:0;margin-bottom:22px;flex-wrap:wrap;}
  .wizard-step{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;font-weight:600;}
  .wizard-step .num{
    width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,.06);border:1px solid var(--border);font-size:12px;font-weight:800;
  }
  .wizard-step.active{color:var(--text);}
  .wizard-step.active .num{background:var(--gold);color:#0A0A0A;border-color:var(--gold);}
  .wizard-step.done{color:var(--gold);}
  .wizard-step.done .num{background:rgba(198,255,26,.2);color:var(--gold);border-color:rgba(198,255,26,.35);}
  .wizard-line{width:28px;height:2px;background:var(--border);margin:0 6px;}
  .wizard-line.done{background:rgba(198,255,26,.4);}
  .wizard-nav{display:flex;justify-content:space-between;gap:12px;margin-top:20px;flex-wrap:wrap;}

  .format-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;}
  .format-card{
    text-align:left;background:rgba(255,255,255,.03);border:1px solid var(--border);
    border-radius:var(--radius-sm);padding:16px;cursor:pointer;transition:.2s;
    display:flex;flex-direction:column;gap:6px;color:var(--text);
  }
  .format-card:hover{border-color:var(--border-strong);background:rgba(255,255,255,.05);}
  .format-card.active{border-color:rgba(198,255,26,.45);background:rgba(198,255,26,.08);box-shadow:0 0 0 1px rgba(198,255,26,.15);}
  .format-icon{
    width:36px;height:36px;border-radius:10px;background:rgba(198,255,26,.12);color:var(--gold);
    display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;
    font-weight:800;font-size:14px;margin-bottom:4px;
  }
  .format-card strong{font-size:15px;}
  .format-card .muted{font-size:12.5px;line-height:1.4;}

  .check-row{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--text);cursor:pointer;margin:8px 0;}
  .check-row input{width:16px;height:16px;accent-color:var(--gold);}

  .pick-list{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow-y:auto;margin-bottom:8px;}
  .pick-item{
    display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;
    background:rgba(255,255,255,.03);border:1px solid var(--border);cursor:pointer;font-size:14px;
  }
  .pick-item.on{border-color:rgba(198,255,26,.35);background:rgba(198,255,26,.08);}
  .pick-item input{accent-color:var(--gold);}

  .review-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:12px;}
  .review-grid > div{display:flex;flex-direction:column;gap:2px;}
  .review-grid b{font-size:15px;}
  @media (max-width:560px){
    .review-grid{grid-template-columns:1fr;}
    .admin-nav{width:100%;}
  }


  /* ========== GLOBAL EFFECTS & MOTION ========== */
  html{scroll-behavior:smooth;}
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    *,*::before,*::after{
      animation-duration:.01ms !important;
      animation-iteration-count:1 !important;
      transition-duration:.01ms !important;
    }
  }

  /* smooth view swap */
  #view{
    animation:viewIn .38s cubic-bezier(.22,1,.36,1) both;
  }
  @keyframes viewIn{
    from{opacity:0;transform:translateY(14px) scale(.992);}
    to{opacity:1;transform:none;}
  }

  /* ambient floating orbs */
  body::before,body::after{
    content:'';position:fixed;pointer-events:none;z-index:0;border-radius:50%;
    filter:blur(80px);opacity:.45;
  }
  body::before{
    width:420px;height:420px;top:-120px;left:-80px;
    background:radial-gradient(circle, rgba(198,255,26,.12), transparent 70%);
    animation:orbFloat 18s ease-in-out infinite alternate;
  }
  body::after{
    width:380px;height:380px;bottom:-100px;right:-60px;
    background:radial-gradient(circle, rgba(90,140,255,.1), transparent 70%);
    animation:orbFloat 22s ease-in-out infinite alternate-reverse;
  }
  @keyframes orbFloat{
    from{transform:translate(0,0) scale(1);}
    to{transform:translate(40px,30px) scale(1.12);}
  }
  .shell,.toast{position:relative;z-index:1;}
  .topbar{z-index:40;}

  /* improved card motion */
  @keyframes cardIn{
    from{opacity:0;transform:translateY(18px) scale(.97);}
    to{opacity:1;transform:none;}
  }
  .card{
    animation:cardIn .5s cubic-bezier(.22,1,.36,1) both;
    transition:transform .35s cubic-bezier(.22,1,.36,1), box-shadow .35s ease, border-color .3s ease, background .3s ease;
  }
  .card:hover{
    transform:translateY(-6px) scale(1.01);
    box-shadow:0 20px 48px rgba(0,0,0,.45), 0 0 0 1px rgba(198,255,26,.2), 0 0 40px rgba(198,255,26,.06);
  }
  .card:active{transform:translateY(-2px) scale(.995);}

  /* banner shine on hover */
  .card .banner{transition:filter .35s ease;}
  .card:hover .banner{filter:brightness(1.08) saturate(1.1);}
  .banner .game-icon{
    transition:transform .4s cubic-bezier(.22,1,.36,1), background .3s ease;
  }
  .card:hover .banner .game-icon{transform:scale(1.08) rotate(-3deg);}

  /* buttons — press + glow */
  .btn{
    position:relative;overflow:hidden;
    transition:transform .2s cubic-bezier(.22,1,.36,1), box-shadow .25s ease, filter .2s ease, background .2s ease, border-color .2s ease;
  }
  .btn::after{
    content:'';position:absolute;inset:0;background:linear-gradient(120deg, transparent 30%, rgba(255,255,255,.18) 50%, transparent 70%);
    transform:translateX(-120%);transition:transform .55s ease;pointer-events:none;
  }
  .btn:hover::after{transform:translateX(120%);}
  .btn:active{transform:scale(.96);}
  .btn-gold:hover{
    filter:brightness(1.1);
    box-shadow:0 8px 28px rgba(198,255,26,.38), 0 0 0 1px rgba(198,255,26,.2);
  }
  .btn-ghost:hover{box-shadow:0 4px 16px rgba(0,0,0,.25);}

  /* nav pills */
  nav button, .admin-nav button, .tabs-inline button{
    transition:color .2s ease, background .25s cubic-bezier(.22,1,.36,1), transform .2s ease, box-shadow .25s ease;
  }
  nav button:hover, .admin-nav button:hover{transform:translateY(-1px);}
  nav button.active, .admin-nav button.active{
    box-shadow:0 2px 12px rgba(198,255,26,.15);
  }
  nav button:active, .admin-nav button:active{transform:scale(.96);}

  /* topbar brand pulse */
  .brand .mark{
    transition:transform .35s cubic-bezier(.22,1,.36,1), box-shadow .35s ease;
  }
  .brand:hover .mark{
    transform:scale(1.08) rotate(-4deg);
    box-shadow:0 6px 24px rgba(198,255,26,.4);
  }

  /* inputs focus glow */
  .field input,.field select,textarea{
    transition:border-color .25s ease, background .25s ease, box-shadow .25s ease, transform .2s ease;
  }
  .field input:focus,.field select:focus,textarea:focus{
    box-shadow:0 0 0 3px rgba(198,255,26,.12);
    transform:translateY(-1px);
  }

  /* hero / detail banners */
  @keyframes fadeUp{
    from{opacity:0;transform:translateY(16px);}
    to{opacity:1;transform:none;}
  }
  @keyframes scaleIn{
    from{opacity:0;transform:scale(.94);}
    to{opacity:1;transform:none;}
  }
  .hero-banner,.detail-banner{
    animation:fadeUp .55s cubic-bezier(.22,1,.36,1) both;
    transition:box-shadow .4s ease, border-color .3s ease;
  }
  .hero-banner:hover,.detail-banner:hover{
    box-shadow:0 12px 40px rgba(0,0,0,.35), 0 0 0 1px rgba(198,255,26,.12);
  }
  .hero-stats .stat{
    transition:transform .3s cubic-bezier(.22,1,.36,1), background .3s ease, border-color .3s ease;
    animation:scaleIn .5s cubic-bezier(.22,1,.36,1) both;
  }
  .hero-stats .stat:nth-child(1){animation-delay:.05s;}
  .hero-stats .stat:nth-child(2){animation-delay:.1s;}
  .hero-stats .stat:nth-child(3){animation-delay:.15s;}
  .hero-stats .stat:nth-child(4){animation-delay:.2s;}
  .hero-stats .stat:hover{
    transform:translateY(-3px);
    background:rgba(255,255,255,.08);
    border-color:rgba(198,255,26,.25);
  }

  /* tags pop */
  .tag{
    transition:transform .25s ease, box-shadow .25s ease;
  }
  .card:hover .tag{transform:scale(1.04);}

  /* match cards */
  .match{
    transition:transform .25s ease, border-color .25s ease, box-shadow .3s ease;
  }
  .match:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 24px rgba(0,0,0,.3);
  }
  .match.decidido{
    animation:matchDone .45s cubic-bezier(.22,1,.36,1) both;
  }
  @keyframes matchDone{
    from{box-shadow:0 0 0 0 rgba(198,255,26,.4);}
    to{box-shadow:inset 0 0 0 1px rgba(198,255,26,.25);}
  }
  .match .slot.win{
    animation:winFlash .5s ease both;
  }
  @keyframes winFlash{
    0%{background:rgba(198,255,26,.2);}
    100%{background:transparent;}
  }

  /* tables */
  tbody tr{
    transition:background .2s ease, transform .2s ease;
  }
  tbody tr:hover{background:rgba(255,255,255,.045);}

  /* podium */
  .podium-spot{
    transition:transform .35s cubic-bezier(.22,1,.36,1), box-shadow .35s ease, border-color .3s ease;
  }
  .podium-spot:hover{transform:translateY(-6px);}
  .podium-spot.first:hover{box-shadow:0 0 0 1px rgba(198,255,26,.25), 0 16px 40px rgba(198,255,26,.12);}
  .podium-spot .medal{
    transition:transform .4s cubic-bezier(.22,1,.36,1);
  }
  .podium-spot:hover .medal{transform:scale(1.12) rotate(-8deg);}

  /* form boxes */
  .form-box{
    animation:fadeUp .45s cubic-bezier(.22,1,.36,1) both;
    transition:box-shadow .3s ease, border-color .3s ease, transform .3s ease;
  }
  .form-box:focus-within{
    border-color:rgba(198,255,26,.22);
    box-shadow:0 8px 32px rgba(0,0,0,.3), 0 0 0 1px rgba(198,255,26,.1);
  }

  /* format cards */
  .format-card{
    transition:transform .3s cubic-bezier(.22,1,.36,1), border-color .25s ease, background .25s ease, box-shadow .3s ease;
  }
  .format-card:hover{transform:translateY(-4px);}
  .format-card.active{
    transform:translateY(-2px);
    box-shadow:0 8px 28px rgba(198,255,26,.12);
  }
  .format-icon{transition:transform .35s cubic-bezier(.22,1,.36,1);}
  .format-card:hover .format-icon,.format-card.active .format-icon{transform:scale(1.1);}

  /* wizard steps */
  .wizard-step .num{transition:transform .3s ease, background .3s ease, color .3s ease, border-color .3s ease;}
  .wizard-step.active .num{animation:pulseGold 1.6s ease infinite;}
  @keyframes pulseGold{
    0%,100%{box-shadow:0 0 0 0 rgba(198,255,26,.35);}
    50%{box-shadow:0 0 0 6px rgba(198,255,26,0);}
  }
  .wizard-line{transition:background .4s ease, width .3s ease;}

  /* pick list */
  .pick-item{transition:background .2s ease, border-color .2s ease, transform .2s ease;}
  .pick-item:hover{transform:translateX(3px);}
  .pick-item.on{box-shadow:0 0 0 1px rgba(198,255,26,.15);}

  /* avatar */
  .avatar-img,.avatar-initials{
    transition:transform .3s cubic-bezier(.22,1,.36,1), box-shadow .3s ease;
  }
  .user-chip:hover .avatar-img,
  .user-chip:hover .avatar-initials{
    transform:scale(1.08);
    box-shadow:0 0 0 2px rgba(198,255,26,.35);
  }

  /* toast upgrade */
  .toast{
    transform:translateX(-50%) translateY(16px) scale(.96);
    transition:opacity .3s cubic-bezier(.22,1,.36,1), transform .3s cubic-bezier(.22,1,.36,1);
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0) scale(1);
  }

  /* empty state */
  .empty{
    animation:fadeUp .5s cubic-bezier(.22,1,.36,1) both;
    transition:border-color .3s ease, background .3s ease;
  }
  .empty:hover{border-color:rgba(198,255,26,.2);background:rgba(255,255,255,.03);}

  /* ticker */
  .ticker-wrap{
    transition:opacity .3s ease, transform .3s ease;
    animation:fadeUp .4s ease both;
  }
  .ticker-track span.ticker-item{
    transition:color .2s ease;
  }

  /* section titles */
  .section-title h1{
    animation:fadeUp .4s cubic-bezier(.22,1,.36,1) both;
  }

  /* scroll reveal utility */
  .reveal{
    opacity:0;transform:translateY(20px);
    transition:opacity .55s cubic-bezier(.22,1,.36,1), transform .55s cubic-bezier(.22,1,.36,1);
  }
  .reveal.in{
    opacity:1;transform:none;
  }

  /* admin stats */
  .admin-stat{
    transition:transform .3s cubic-bezier(.22,1,.36,1), border-color .25s ease, box-shadow .3s ease;
    animation:scaleIn .45s cubic-bezier(.22,1,.36,1) both;
  }
  .admin-stat:nth-child(1){animation-delay:.04s;}
  .admin-stat:nth-child(2){animation-delay:.08s;}
  .admin-stat:nth-child(3){animation-delay:.12s;}
  .admin-stat:nth-child(4){animation-delay:.16s;}
  .admin-stat:nth-child(5){animation-delay:.2s;}
  .admin-stat:hover{
    transform:translateY(-4px);
    border-color:rgba(198,255,26,.25);
    box-shadow:0 8px 24px rgba(0,0,0,.3);
  }

  /* nivel badges */
  .nivel-badge{transition:transform .2s ease, box-shadow .2s ease;}
  .nivel-badge:hover{transform:scale(1.06);}

  /* sticky topbar glass strengthen on scroll */
  .topbar.scrolled{
    background:rgba(7,8,10,.85);
    backdrop-filter:blur(18px) saturate(1.3);
    border-bottom:1px solid var(--border);
    box-shadow:0 8px 32px rgba(0,0,0,.35);
  }

  /* smooth image load */
  .avatar-img{opacity:0;animation:imgFade .4s ease forwards;}
  @keyframes imgFade{to{opacity:1;}}

  /* bracket connectors subtle glow */
  .pair::after{
    transition:border-color .3s ease;
  }
  .bracket:hover .pair::after{
    border-color:rgba(198,255,26,.5);
  }

  /* custom selection */
  ::selection{background:rgba(198,255,26,.3);color:#fff;}

  /* scrollbar thumb hover */
  ::-webkit-scrollbar-thumb:hover{background:rgba(198,255,26,.35);}


  /* ---- auth modal ---- */
  .auth-overlay{
    position:fixed;inset:0;z-index:100;
    display:flex;align-items:center;justify-content:center;
    padding:20px;
    background:rgba(4,5,8,.72);
    backdrop-filter:blur(10px) saturate(1.1);
    animation:overlayIn .35s ease both;
  }
  .auth-overlay[hidden]{display:none !important;}
  .auth-overlay.closing{animation:overlayOut .25s ease both;}
  @keyframes overlayIn{from{opacity:0;}to{opacity:1;}}
  @keyframes overlayOut{from{opacity:1;}to{opacity:0;}}

  .auth-modal{
    position:relative;width:min(400px,100%);
    background:rgba(18,20,24,.94);
    border:1px solid var(--border-strong);
    border-radius:20px;
    padding:28px 26px 24px;
    box-shadow:0 24px 64px rgba(0,0,0,.55), 0 0 0 1px rgba(198,255,26,.08);
    backdrop-filter:blur(20px);
    animation:modalIn .45s cubic-bezier(.22,1,.36,1) both;
  }
  .auth-overlay.closing .auth-modal{animation:modalOut .25s ease both;}
  @keyframes modalIn{
    from{opacity:0;transform:translateY(24px) scale(.94);}
    to{opacity:1;transform:none;}
  }
  @keyframes modalOut{
    from{opacity:1;transform:none;}
    to{opacity:0;transform:translateY(12px) scale(.96);}
  }

  .auth-close{
    position:absolute;top:12px;right:14px;
    width:34px;height:34px;border-radius:50%;
    border:1px solid var(--border);background:rgba(255,255,255,.04);
    color:var(--muted);font-size:22px;line-height:1;cursor:pointer;
    transition:.2s ease;
  }
  .auth-close:hover{color:var(--text);background:rgba(255,255,255,.08);transform:rotate(90deg);}

  .auth-brand{
    display:flex;align-items:center;gap:10px;margin-bottom:16px;
    font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:18px;letter-spacing:.5px;text-transform:uppercase;
  }
  .auth-brand .mark{
    width:32px;height:32px;border-radius:9px;
    background:linear-gradient(145deg,var(--gold-2),var(--gold));
    color:#0A0A0A;display:flex;align-items:center;justify-content:center;font-size:16px;
    box-shadow:0 4px 14px rgba(198,255,26,.3);
  }

  .auth-modal h2{
    margin:0 0 6px;font-size:26px;font-family:'Barlow Condensed',sans-serif;font-weight:750;
  }
  .auth-sub{color:var(--muted);margin:0 0 18px;font-size:13.5px;line-height:1.45;}

  .auth-links{
    display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;
    margin-top:14px;
  }
  .link-btn{
    background:none;border:none;color:var(--gold);font-size:13px;font-weight:650;
    cursor:pointer;padding:4px 0;text-decoration:none;
    transition:opacity .2s ease;
  }
  .link-btn:hover{opacity:.75;text-decoration:underline;}

  .auth-modal .field input:focus{
    box-shadow:0 0 0 3px rgba(198,255,26,.14);
  }


  .featured{
    position:relative;overflow:hidden;
    border-radius:var(--radius);
    border:1px solid var(--border);
    background:var(--surface);
    backdrop-filter:var(--glass);
    margin-bottom:18px;
    box-shadow:var(--shadow-soft);
    animation:fadeUp .45s cubic-bezier(.22,1,.36,1) both;
  }
  .featured-inner{
    display:grid;grid-template-columns:1.2fr 1fr;gap:0;
    min-height:0;
  }
  @media (max-width:760px){
    .featured-inner{grid-template-columns:1fr;}
  }
  .featured-main{
    padding:22px 24px;position:relative;z-index:1;
  }
  .featured-main .tag{margin-bottom:10px;}
  .featured-main h2{
    margin:0 0 6px;font-size:clamp(24px,4vw,32px);line-height:1.1;
    font-family:'Barlow Condensed',sans-serif;font-weight:750;
  }
  .featured-quote{
    margin:12px 0 0;padding:12px 14px;
    border-left:3px solid var(--gold);
    background:rgba(198,255,26,.06);
    border-radius:0 10px 10px 0;
    font-size:13.5px;line-height:1.5;color:rgba(255,255,255,.88);
  }
  .featured-quote cite{
    display:block;margin-top:6px;font-size:11.5px;color:var(--muted);
    font-style:normal;font-weight:600;
  }
  .featured-side{
    padding:18px 20px;border-left:1px solid var(--border);
    background:rgba(0,0,0,.18);
  }
  @media (max-width:760px){
    .featured-side{border-left:none;border-top:1px solid var(--border);}
  }
  .featured-side h4{
    margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.4px;
    color:var(--muted);font-weight:700;
  }

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.remove('show');
  void t.offsetWidth; // restart anim
  t.classList.add('show');
  clearTimeout(window._tt);
  window._tt=setTimeout(()=>t.classList.remove('show'),2400);
}

function restartViewAnim(){
  const view = document.getElementById('view');
  if(!view) return;
  view.style.animation = 'none';
  void view.offsetWidth;
  view.style.animation = '';
}

function setupScrollEffects(){
  const topbar = document.querySelector('.topbar');
  if(!topbar || topbar._scrollBound) return;
  topbar._scrollBound = true;
  const onScroll = ()=>{
    if(window.scrollY > 12) topbar.classList.add('scrolled');
    else topbar.classList.remove('scrolled');
  };
  window.addEventListener('scroll', onScroll, {passive:true});
  onScroll();
}

function staggerCards(container){
  if(!container) return;
  const cards = container.querySelectorAll('.card, .admin-stat, .podium-spot, .format-card, .match');

function h(html){
  const d=document.createElement('div');
  d.innerHTML=html.trim();

function animateCounters(container){
  container.querySelectorAll('[data-count]').forEach(el=>{
    const target = parseInt(el.dataset.count,10)||0;
    const start = performance.now();
    const duration = 900;
    function step(now){
      const t = Math.min((now-start)/duration,1);
      // easeOutExpo
      const p = t===1 ? 1 : 1 - Math.pow(2, -10 * t);
      el.textContent = Math.round(p*target);
      if(t<1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
}

function initialsFromName(nome){
  if(!nome) return '?';

  if(parts.length>=2) return (parts[0][0]+parts[1][0]).toUpperCase();
  return String(nome).slice(0,2).toUpperCase();

function avatarHTML(userOrNome, sizeClass=''){

  }

}

function resizeImageToDataURL(file, maxSize){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error('read fail'));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>reject(new Error('img fail'));
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > maxSize || h > maxSize){
          if(w > h){ h = Math.round(h * maxSize / w); w = maxSize; }
          else { w = Math.round(w * maxSize / h); h = maxSize; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.82));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

  const row = {

    bio: u.bio||'',

    tema: u.tema||'verde',
    pontos: Number(u.pontos)||0,
    updated_at: new Date().toISOString()
  };
  const { error } = await db.from('perfis').upsert(row, { onConflict: 'id' });
  if(error){
    // tabela pode não existir ainda — silencioso
    console.warn('perfis upsert:', error.message||error);
  }
}

  if(error){ console.error(error); toast('Erro ao salvar torneio: '+(error.message||'')); }
}
async function criarTorneio(payload){
  const row = {
    nome: payload.nome,
    jogo: payload.jogo,
    data_inicio: payload.data_inicio||null,
    regras: payload.regras||'',
    status: payload.status||'aberto',
    times: payload.times||[],
    formato: payload.formato||'mata_mata',
    config: payload.config||{},
    grupos: payload.grupos||null,
    partidas: payload.partidas||null
  };
  const { data, error } = await db.from('torneios').insert(row).select().single();
  if(error){
    console.error(error);
    // fallback se colunas novas ainda não existem
    if(String(error.message||'').toLowerCase().includes('column') || error.code==='PGRST204'){
      const { error: e2 } = await db.from('torneios').insert({
        nome: row.nome, jogo: row.jogo, data_inicio: row.data_inicio, regras: row.regras,
        status: row.status, times: row.times, partidas: row.partidas
      });
      if(e2){ console.error(e2); toast('Erro ao criar campeonato'); return false; }
      toast('Campeonato criado (adicione colunas formato/config/grupos no Supabase para recursos completos)');
      await loadTorneios();
      return true;
    }
    toast('Erro ao criar campeonato (você precisa ser admin)');
    return false;
  }
  await loadTorneios();
  return data;
}
async function excluirTorneio(id){
  const { error } = await db.from('torneios').delete().eq('id', id);
  if(error){ console.error(error); toast('Erro ao excluir campeonato'); return; }

}
async function criarTime(nome, jogo){
  const avatar = state.user && state.user.avatar ? state.user.avatar : null;
  const row = {nome, jogo, jogadores:[], dono: state.user.id, avatar};
  let { data, error } = await db.from('times').insert(row).select().single();
  if(error && (String(error.message||'').toLowerCase().includes('column') || error.code==='PGRST204')){
    // tabela sem coluna avatar — grava sem ela
    ({ data, error } = await db.from('times').insert({nome, jogo, jogadores:[], dono: state.user.id}).select().single());
    if(data) data.avatar = avatar; // mantém na sessão
  }
  if(error){ console.error(error); toast('Erro ao criar inscrição'); return null; }
  if(data && avatar && !data.avatar) data.avatar = avatar;
  await loadTimes();
  // se loadTimes não trouxe avatar (coluna inexistente), reaplicamos no state
  if(data && avatar){
    const tm = state.times.find(x=>x.id===data.id);
    if(tm && !tm.avatar) tm.avatar = avatar;
  }
  return data;
}
async function syncMeuAvatarNosTimes(){
  if(!state.user) return;
  const avatar = state.user.avatar || null;
  const meus = state.times.filter(tm=>tm.dono===state.user.id);
  for(const tm of meus){
    tm.avatar = avatar;
    const { error } = await db.from('times').update({ avatar, nome: state.user.nome }).eq('id', tm.id);
    if(error && !(String(error.message||'').toLowerCase().includes('column'))){
      // tenta só o nome
      await db.from('times').update({ nome: state.user.nome }).eq('id', tm.id);
    }
  }
}

async function inscreverNoTorneio(t){
  if(!state.user){ toast('Faça login para se inscrever'); return; }
  if(t.status!=='aberto'){ toast('Inscrições fechadas neste campeonato'); return; }
  const maxI = t.config && Number(t.config.maxInscritos);
  if(maxI > 0 && (t.times||[]).length >= maxI){ toast('Campeonato lotado ('+maxI+' vagas)'); return; }
  if(await jaInscritoNoTorneio(t, state.user.id)){
    toast('Você já está inscrito neste campeonato');
    return;
  }
  // 1 inscrição por usuário: usa o nome de exibição atual
  let meuTime = state.times.find(tm=> tm.jogo===t.jogo && tm.dono===state.user.id);
  if(!meuTime){
    meuTime = await criarTime(state.user.nome, t.jogo);
    if(!meuTime) return;
  } else {
    const patch = { nome: state.user.nome, avatar: state.user.avatar || null };
    const { error } = await db.from('times').update(patch).eq('id', meuTime.id);
    if(error && String(error.message||'').toLowerCase().includes('column')){
      await db.from('times').update({ nome: state.user.nome }).eq('id', meuTime.id);
    }
    meuTime.nome = state.user.nome;
    meuTime.avatar = state.user.avatar || null;
    await loadTimes();
    const tm = state.times.find(x=>x.id===meuTime.id);
    if(tm){ tm.nome = meuTime.nome; tm.avatar = meuTime.avatar; }
  }
  if((t.times||[]).includes(meuTime.id)){ toast('Você já está inscrito neste campeonato'); return; }
  t.times = [...(t.times||[]), meuTime.id];
  await saveTorneio(t);
  toast('Inscrição confirmada como '+state.user.nome+'!');
  render();
}

/* ================= bracket logic ================= */
function nextPow2(n){ let p=1; while(p<n) p*=2; return p; }

function shuffleArr(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function gerarChaveamento(times){
  const shuffled = shuffleArr(times);
  const size = nextPow2(Math.max(shuffled.length,2));
  while(shuffled.length < size) shuffled.push(null);
  const totalRounds = Math.log2(size);
  const matches = [];
  let idCounter = 0;
  for(let i=0;i<size/2;i++){
    matches.push({id: idCounter++, fase:'mata_mata', round:0, pos:i, timeA: shuffled[i*2], timeB: shuffled[i*2+1], vencedor:null, scoreA:'', scoreB:''});
  }
  for(let r=1;r<totalRounds;r++){
    const count = size/Math.pow(2,r+1);
    for(let i=0;i<count;i++){
      matches.push({id: idCounter++, fase:'mata_mata', round:r, pos:i, timeA:null, timeB:null, vencedor:null, scoreA:'', scoreB:''});
    }
  }
  resolveByes(matches, totalRounds);
  return matches;
}

function gerarPontosCorridos(times, idaVolta){
  const list = shuffleArr(times.filter(Boolean));
  const matches = [];
  let id=0;
  for(let i=0;i<list.length;i++){
    for(let j=i+1;j<list.length;j++){
      matches.push({id:id++, fase:'pontos', round:0, pos:matches.length, grupo:null, timeA:list[i], timeB:list[j], vencedor:null, scoreA:'', scoreB:''});
      if(idaVolta){
        matches.push({id:id++, fase:'pontos', round:0, pos:matches.length, grupo:null, timeA:list[j], timeB:list[i], vencedor:null, scoreA:'', scoreB:''});
      }
    }
  }
  return matches;
}

function gerarGrupos(times, numGrupos, idaVolta){
  const list = shuffleArr(times.filter(Boolean));
  const n = Math.max(2, Math.min(numGrupos, Math.floor(list.length/2) || 2));
  const grupos = Array.from({length:n}, (_,i)=>({ id:i, nome:'Grupo '+String.fromCharCode(65+i), times:[], tabela:[] }));
  list.forEach((tm,i)=> grupos[i%n].times.push(tm));
  const matches = [];
  let id=0;
  grupos.forEach(g=>{
    g.tabela = g.times.map(tm=>({ id:tm.id, nome:tm.nome, j:0, v:0, e:0, d:0, gp:0, gc:0, pts:0 }));
    for(let i=0;i<g.times.length;i++){
      for(let j=i+1;j<g.times.length;j++){
        matches.push({id:id++, fase:'grupo', round:0, pos:matches.length, grupo:g.id, timeA:g.times[i], timeB:g.times[j], vencedor:null, scoreA:'', scoreB:''});
        if(idaVolta){
          matches.push({id:id++, fase:'grupo', round:0, pos:matches.length, grupo:g.id, timeA:g.times[j], timeB:g.times[i], vencedor:null, scoreA:'', scoreB:''});
        }
      }
    }
  });
  return { grupos, matches };
}

function gerarDuplaEliminacao(times){
  // Winners bracket = normal single elim; losers bracket slots reserved
  const base = gerarChaveamento(times);
  base.forEach(m=>{ m.fase='winners'; m.bracket='winners'; });
  // Losers bracket matches created as empty shells proportional to winners
  const winnersRounds = Math.max(...base.map(m=>m.round))+1;
  let id = base.length ? Math.max(...base.map(m=>m.id))+1 : 0;
  const losers = [];
  // simplified: one losers match per winners match except final
  for(let r=0;r<winnersRounds-1;r++){
    const count = base.filter(m=>m.round===r && m.fase==='winners').length;
    for(let i=0;i<count;i++){
      losers.push({id:id++, fase:'losers', bracket:'losers', round:r, pos:i, timeA:null, timeB:null, vencedor:null, scoreA:'', scoreB:''});
    }
  }
  // grand final
  losers.push({id:id++, fase:'grand_final', bracket:'grand_final', round:0, pos:0, timeA:null, timeB:null, vencedor:null, scoreA:'', scoreB:''});
  return [...base, ...losers];
}

function atualizarTabelaGrupo(t, match){
  if(!t.grupos || match.fase!=='grupo' || match.scoreA==='' || match.scoreB==='') return;
  const g = t.grupos.find(x=>x.id===match.grupo);
  if(!g) return;
  const sa = Number(match.scoreA), sb = Number(match.scoreB);
  const rowA = g.tabela.find(r=>r.id===(match.timeA&&match.timeA.id));
  const rowB = g.tabela.find(r=>r.id===(match.timeB&&match.timeB.id));
  if(!rowA||!rowB) return;
  // reset then rebuild from all group matches (safer)
  g.tabela.forEach(r=>{ r.j=0;r.v=0;r.e=0;r.d=0;r.gp=0;r.gc=0;r.pts=0; });
  (t.partidas||[]).filter(m=>m.fase==='grupo' && m.grupo===g.id && m.scoreA!=='' && m.scoreB!=='').forEach(m=>{
    const a = g.tabela.find(r=>r.id===(m.timeA&&m.timeA.id));
    const b = g.tabela.find(r=>r.id===(m.timeB&&m.timeB.id));
    if(!a||!b) return;
    const x=Number(m.scoreA), y=Number(m.scoreB);
    a.j++; b.j++; a.gp+=x; a.gc+=y; b.gp+=y; b.gc+=x;
    if(x>y){ a.v++; b.d++; a.pts+=3; }
    else if(y>x){ b.v++; a.d++; b.pts+=3; }
    else { a.e++; b.e++; a.pts++; b.pts++; }
  });
  g.tabela.sort((a,b)=> b.pts-a.pts || (b.gp-b.gc)-(a.gp-a.gc) || b.gp-a.gp);
}

function classificadosDosGrupos(t){
  const n = (t.config && t.config.classificadosPorGrupo) || 2;
  const adv = [];
  (t.grupos||[]).forEach(g=>{
    g.tabela.slice(0,n).forEach(r=>{
      const tm = g.times.find(x=>x.id===r.id) || {id:r.id, nome:r.nome};
      adv.push(tm);
    });
  });
  return adv;
}

function gruposCompletos(t){
  const groupMatches = (t.partidas||[]).filter(m=>m.fase==='grupo');
  return groupMatches.length>0 && groupMatches.every(m=>m.vencedor || (m.scoreA!==''&&m.scoreB!==''&&Number(m.scoreA)===Number(m.scoreB)));
}

function resolveByes(matches, totalRounds){
  for(let r=0;r<totalRounds;r++){
    matches.filter(m=>m.round===r && (m.fase==='mata_mata'||m.fase==='winners'||!m.fase)).forEach(m=>{
      if(m.vencedor) return;
      if(m.timeA && !m.timeB){ setVencedor(matches, m, m.timeA, totalRounds); }
      else if(m.timeB && !m.timeA){ setVencedor(matches, m, m.timeB, totalRounds); }
    });
  }
}

function setVencedor(matches, match, timeVencedor, totalRounds){
  match.vencedor = timeVencedor;
  if(match.fase==='grupo' || match.fase==='pontos') return;
  if(match.fase==='grand_final') return;
  if(match.round+1 >= totalRounds) return;
  const nextPos = Math.floor(match.pos/2);
  const nextFase = match.fase==='winners' ? 'winners' : (match.fase||'mata_mata');
  const next = matches.find(m=>m.round===match.round+1 && m.pos===nextPos && (m.fase===nextFase || (!m.fase && nextFase==='mata_mata')));
  if(!next) return;
  if(match.pos % 2 === 0) next.timeA = timeVencedor; else next.timeB = timeVencedor;
  if(next.timeA && !next.timeB) setVencedor(matches, next, next.timeA, totalRounds);
  else if(next.timeB && !next.timeA) setVencedor(matches, next, next.timeB, totalRounds);
}

function iniciarTorneioComFormato(t, timesObjs){
  const times = timesObjs.map(tm=>({id:tm.id, nome:tm.nome}));
  const formato = t.formato || 'mata_mata';
  const config = t.config || {};
  if(formato==='mata_mata'){
    t.partidas = gerarChaveamento(times);
    t.grupos = null;
  } else if(formato==='pontos'){
    t.partidas = gerarPontosCorridos(times, !!config.idaVolta);
    t.grupos = null;
  } else if(formato==='grupos_mata_mata'){
    const { grupos, matches } = gerarGrupos(times, config.numGrupos||4, !!config.idaVolta);
    t.grupos = grupos;
    t.partidas = matches;
  } else if(formato==='dupla_eliminacao'){
    t.partidas = gerarDuplaEliminacao(times);
    t.grupos = null;
  } else if(formato==='livre'){
    t.partidas = [];
    t.grupos = null;
  } else {
    t.partidas = gerarChaveamento(times);
  }
  t.status = 'andamento';
}

function renderNav(){
  const nav = document.getElementById('mainNav');
  const tabs = [['torneios','Torneios'],['jogadores','Jogadores'],['ranking','Ranking']];
  if(state.user) tabs.push(['expdcoin','ExpdCoin']);
  if(state.user) tabs.push(['perfil','Perfil']);
  if(state.user && state.user.role==='admin') tabs.push(['admin','Admin']);
  nav.innerHTML = tabs.map(([id,label])=>`<button data-tab="${id}" class="${state.tab===id?'active':''}">${label}</button>`).join('');
  nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    const next=b.dataset.tab;
    if(next!=='admin') state.wizard=null;
    state.tab=next; state.torneioAtivo=null; state.perfilId=null; render();
  });

  const sb = document.getElementById('sessionBox');
  if(state.user){
    sb.innerHTML = `<span class="user-chip" style="cursor:pointer" title="Meu perfil">${avatarHTML(state.user)} <span>Olá, <b>${state.user.nome}</b> · <b style="color:var(--gold)">${state.user.pontos||0} pts</b></span></span><button class="btn btn-ghost" id="logoutBtn">Sair</button>`;
    sb.querySelector('.user-chip').onclick = ()=>{ state.tab='perfil'; state.perfilId=null; render(); };
    document.getElementById('logoutBtn').onclick = async ()=>{ await db.auth.signOut(); state.user=null; state.tab='torneios'; render(); };
  } else {
    sb.innerHTML = `<button class="btn btn-gold" id="loginBtn">Entrar</button>`;
    document.getElementById('loginBtn').onclick = ()=> openLoginModal('login');
  }
  const brand = document.getElementById('brandHome');
  if(brand && !brand._bound){
    brand._bound = true;
    const goHome = ()=>{ state.tab='torneios'; state.torneioAtivo=null; state.perfilId=null; state.adminTab='dashboard'; render(); };
    brand.onclick = goHome;
    brand.onkeydown = (e)=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); goHome(); } };
  }
}

function render(){
  const tabChanged = state._lastTab !== state.tab || state._lastTorneio !== state.torneioAtivo || state._lastAdminTab !== state.adminTab || state._lastPerfilId !== state.perfilId;
  state._lastTab = state.tab;
  state._lastTorneio = state.torneioAtivo;
  state._lastAdminTab = state.adminTab;
  state._lastPerfilId = state.perfilId;

  renderNav();
  renderTicker();
  const view = document.getElementById('view');
  view.innerHTML = '';
  if(tabChanged) restartViewAnim();
  syncURL();
  if(state.tab==='login') renderLogin(view);
  else if(state.tab==='torneios') state.torneioAtivo ? renderTorneioDetalhe(view) : renderTorneios(view);
  else if(state.tab==='jogadores') renderJogadores(view);
  else if(state.tab==='ranking') renderRanking(view);
  else if(state.tab==='expdcoin') renderExpdCoin(view);
  else if(state.tab==='perfil') renderPerfil(view);
  else if(state.tab==='perfilPublico') renderPerfilPublico(view);
  else if(state.tab==='admin') renderAdmin(view);
  requestAnimationFrame(()=> staggerCards(view));
  if(tabChanged){
    window.scrollTo({top:0, behavior:'smooth'});
  }
}
function syncURL(){
  const url = new URL(window.location.href);
  if(state.tab==='torneios' && state.torneioAtivo){
    url.searchParams.set('torneio', state.torneioAtivo);
  } else {
    url.searchParams.delete('torneio');
  }
  history.replaceState(null, '', url.toString());
}

  const title = document.getElementById('authTitle');
  const sub = document.getElementById('authSub');

function openLoginModal(pane='login'){
  const overlay = document.getElementById('authOverlay');
  if(!overlay) return;
  overlay.hidden = false;
  overlay.classList.remove('closing');
  // restart animation
  const modal = overlay.querySelector('.auth-modal');
  if(modal){ modal.style.animation = 'none'; void modal.offsetWidth; modal.style.animation = ''; }
  setAuthPane(pane);
  document.body.style.overflow = 'hidden';
}

function closeLoginModal(){
  const overlay = document.getElementById('authOverlay');
  if(!overlay || overlay.hidden) return;
  overlay.classList.add('closing');
  setTimeout(()=>{
    overlay.hidden = true;
    overlay.classList.remove('closing');
    document.body.style.overflow = '';
  }, 240);
}

function bindAuthModal(){
  const overlay = document.getElementById('authOverlay');
  if(!overlay || overlay._bound) return;
  overlay._bound = true;

  document.getElementById('authClose').onclick = ()=> closeLoginModal();
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closeLoginModal(); });
  document.addEventListener('keydown', (e)=>{
    if(e.key==='Escape' && !overlay.hidden) closeLoginModal();
  });

  document.getElementById('mLoginBtn').onclick = ()=> doModalLogin();
  document.getElementById('mRegBtn').onclick = ()=> doModalRegister();
  document.getElementById('mForgotSend').onclick = ()=> doModalForgot();
  document.getElementById('mForgotBtn').onclick = ()=> setAuthPane('forgot');
  document.getElementById('mGoRegister').onclick = ()=> setAuthPane('register');
  document.getElementById('mGoLogin').onclick = ()=> setAuthPane('login');
  document.getElementById('mBackLogin').onclick = ()=> setAuthPane('login');

  // Enter submits current pane
  ['mEmail','mPass'].forEach(id=>{
    document.getElementById(id).addEventListener('keydown', e=>{
      if(e.key==='Enter'){ e.preventDefault(); doModalLogin(); }
    });
  });
  ['mNome','mRegEmail','mRegPass'].forEach(id=>{
    document.getElementById(id).addEventListener('keydown', e=>{
      if(e.key==='Enter'){ e.preventDefault(); doModalRegister(); }
    });
  });
  document.getElementById('mForgotEmail').addEventListener('keydown', e=>{
    if(e.key==='Enter'){ e.preventDefault(); doModalForgot(); }
  });
}

const GAMER_QUOTES = [
  { text: 'The only thing that matters is the will to win.', cite: 'Faker — League of Legends' },
  { text: 'I came here to win, not to participate.', cite: 's1mple — CS' },
  { text: 'Play for the love of the game, and the titles will follow.', cite: 'Coldzera — CS' },
  { text: 'In esports, every round is a new chance to rewrite history.', cite: 'Cultura competitiva' },
  { text: 'Aim for the head, and never lose your calm.', cite: 'TenZ — Valorant' },
  { text: 'Champions are made when nobody is watching.', cite: 'Cena gamer' },
  { text: 'One shot, one opportunity — don’t let it slip.', cite: 'Espírito competitivo' },
  { text: 'We don’t play to finish second.', cite: 'Astralis / era dominante CS' },
  { text: 'Pressure is a privilege — it means you’re in the fight.', cite: 'Atletas de elite' },
