<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>e-Expedition — Campeonatos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #09090B;
    --bg-soft: #0D0D0F;
    --surface: #141416;
    --surface-2: #1C1C1F;
    --border: #2A2A2E;
    --text: #F2F3F5;
    --muted: #8B8D93;
    --gold: #C6FF1A;
    --gold-2: #DFFF66;
    --violet: #1E1F22;
    --violet-2: #C6FF1A;
    --win: #C6FF1A;
    --loss: #FF3B4E;
    --radius: 8px;
    --shadow: 0 10px 28px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;overflow-x:hidden;}
  body{
    margin:0;color:var(--text);font-family:'Manrope',sans-serif;line-height:1.55;font-size:15px;
    background:
      radial-gradient(800px 380px at 15% -10%, rgba(198,255,26,.08), transparent 60%),
      radial-gradient(600px 320px at 100% 0%, rgba(198,255,26,.05), transparent 55%),
      var(--bg);
    background-attachment:fixed;
  }
  h1,h2,h3,.display{font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:0.2px;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  input,select{font-family:inherit;}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--violet-2);outline-offset:2px;}
  ::-webkit-scrollbar{height:8px;width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--surface-2);border-radius:8px;}
  ::-webkit-scrollbar-track{background:transparent;}

  /* ---- shell ---- */
  .shell{max-width:1120px;margin:0 auto;padding:0 clamp(16px,4vw,24px) 80px;}
  .topbar{
    display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
    padding:18px 0;border-bottom:1px solid var(--border);margin-bottom:clamp(20px,4vw,32px);
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .mark{
    width:32px;height:32px;border-radius:6px;flex-shrink:0;
    background:linear-gradient(135deg,var(--gold-2),var(--gold) 55%,#8FCC00);
    display:flex;align-items:center;justify-content:center;
    font-family:'Barlow Condensed';font-weight:800;color:#0A0A0A;font-size:17px;
    box-shadow:0 4px 14px rgba(198,255,26,.3);
  }
  .brand .word{font-family:'Barlow Condensed';font-weight:800;font-size:19px;letter-spacing:0.6px;white-space:nowrap;text-transform:uppercase;}

  nav{
    display:flex;gap:3px;background:var(--surface);padding:4px;border-radius:12px;border:1px solid var(--border);
    overflow-x:auto;scrollbar-width:none;order:3;flex:1 1 100%;
  }
  nav::-webkit-scrollbar{display:none;}
  nav button{
    background:transparent;border:none;color:var(--muted);padding:9px 16px;border-radius:6px;
    font-size:13.5px;font-weight:700;white-space:nowrap;transition:.15s ease;text-transform:uppercase;letter-spacing:.3px;
  }
  nav button:hover{color:var(--text);}
  nav button.active{background:var(--surface-2);color:var(--gold);box-shadow:inset 0 -2px 0 var(--gold);}

  .session{display:flex;align-items:center;gap:12px;font-size:13.5px;color:var(--muted);order:2;margin-left:auto;}
  .session b{color:var(--text);}

  .btn{border:none;border-radius:8px;padding:9px 16px;font-weight:700;font-size:14px;transition:.15s ease;}
  .btn-gold{background:linear-gradient(135deg,var(--gold-2),var(--gold));color:#0A0A0A;}
  .btn-gold:hover{filter:brightness(1.06);transform:translateY(-1px);}
  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text);}
  .btn-ghost:hover{background:var(--surface-2);border-color:#33465a;}
  .btn-danger{background:transparent;border:1px solid var(--loss);color:var(--loss);}
  .btn-danger:hover{background:rgba(229,72,77,.1);}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none !important;filter:none !important;}

  /* ---- hero ---- */
  .hero{padding:clamp(20px,5vw,38px) 0 clamp(18px,3vw,30px);}
  .hero h1{font-size:clamp(32px,6vw,56px);line-height:0.98;margin:0 0 10px;
    background:linear-gradient(135deg,var(--text) 40%,var(--gold-2));
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  .hero p{color:var(--muted);max-width:540px;font-size:clamp(14px,2vw,16px);margin:0;}

  /* ---- cards / grid ---- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr));gap:clamp(12px,2vw,16px);}
  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:18px;transition:.18s ease;
  }
  .card:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(0,0,0,.5),0 0 0 1px rgba(198,255,26,.25);border-color:rgba(198,255,26,.35);}
  .card h3{margin:0 0 4px;font-size:23px;}
  .tag{display:inline-block;font-size:11px;font-weight:800;color:var(--bg);background:var(--gold);padding:3px 10px;border-radius:4px;margin-bottom:10px;letter-spacing:.6px;text-transform:uppercase;}
  .tag.status-aberto{background:var(--gold);}
  .tag.status-andamento{background:#FFB020;}
  .tag.status-finalizado{background:var(--muted);color:#0A0A0A;}
  .muted{color:var(--muted);font-size:13.5px;}
  .card .row{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:10px;flex-wrap:wrap;}

  /* ---- forms ---- */
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px;font-weight:600;}
  .field input,.field select{
    width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);
    padding:10px 12px;border-radius:8px;font-size:14.5px;transition:.15s;
  }
  .field input:focus,.field select:focus{border-color:var(--violet-2);}
  .form-box{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:20px;flex:1 1 320px;max-width:420px;box-shadow:var(--shadow);
  }
  .form-row{display:flex;gap:24px;flex-wrap:wrap;}

  /* ---- bracket ---- */
  .bracket{display:flex;gap:clamp(18px,3vw,34px);overflow-x:auto;padding:10px 2px 20px;-webkit-overflow-scrolling:touch;}
  .round-col{display:flex;flex-direction:column;justify-content:space-around;min-width:200px;gap:20px;}
  .round-title{font-family:'Barlow Condensed';font-weight:700;color:var(--muted);font-size:15px;margin-bottom:6px;}
  .match{background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden;transition:.15s;}
  .match:hover{border-color:#33465a;}
  .match .slot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;font-size:14px;border-bottom:1px solid var(--border);}
  .match .slot:last-child{border-bottom:none;}
  .match .slot.win{color:var(--win);font-weight:700;}
  .match .slot.bye{color:var(--muted);font-style:italic;}
  .match .slot input{width:38px;background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:5px;padding:4px;font-size:13px;text-align:center;}
  .match .slot .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;}

  .table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);}
  table{width:100%;border-collapse:collapse;min-width:420px;}
  th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--border);font-size:14px;white-space:nowrap;}
  th{color:var(--muted);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.4px;}
  tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--surface-2);}

  /* ---- hero banner (grande, com gradiente e padrão decorativo) ---- */
  .hero-banner{
    position:relative;overflow:hidden;
    width:100vw;margin-left:calc(50% - 50vw);margin-right:calc(50% - 50vw);
    padding:clamp(28px,6vw,52px) 0;
    background: linear-gradient(rgba(5,5,6,.78), rgba(5,5,6,.88)), url('fundo-hero.jpg'), linear-gradient(120deg,#050506 0%,#0C0F08 45%,#182410 75%,#243710 100%);
    background-size:cover;background-position:center;
    border-top:1px solid var(--border);border-bottom:1px solid var(--border);
    margin-bottom:clamp(22px,4vw,32px);box-shadow:var(--shadow);
  }
  .hero-banner::before{content:'';position:absolute;inset:0;background-image:
    radial-gradient(circle at 88% 10%, rgba(198,255,26,.22), transparent 40%),
    radial-gradient(circle at 10% 115%, rgba(0,0,0,.5), transparent 55%);}
  .hero-banner::after{content:'';position:absolute;right:-40px;top:-40px;width:230px;height:230px;border-radius:50%;
    border:2px solid rgba(198,255,26,.18);pointer-events:none;}
  .hero-banner .inner{position:relative;max-width:1120px;margin:0 auto;padding:0 clamp(20px,5vw,44px);}
  .hero-banner h1{color:#fff;-webkit-text-fill-color:#fff;background:none;font-size:clamp(32px,6vw,54px);margin:0 0 10px;line-height:1;}
  .hero-banner p{color:rgba(255,255,255,.85);max-width:560px;font-size:clamp(14px,2vw,16px);margin:0 0 20px;}
  .hero-stats{display:flex;gap:clamp(18px,4vw,32px);flex-wrap:wrap;}
  .hero-stats .stat b{display:block;font-family:'Barlow Condensed';font-size:30px;color:#fff;line-height:1;}
  .hero-stats .stat span{font-size:11.5px;color:rgba(255,255,255,.75);text-transform:uppercase;letter-spacing:.5px;}

  /* ---- banners de card (jogo) ---- */
  .banner{height:104px;position:relative;display:flex;align-items:flex-end;justify-content:flex-end;padding:10px 12px;overflow:hidden;}
  .banner::after{content:'';position:absolute;inset:0;background-image:
    radial-gradient(circle at 12% 130%, rgba(255,255,255,.22), transparent 55%),
    radial-gradient(circle at 100% -20%, rgba(255,255,255,.16), transparent 45%);}
  .banner .banner-emoji{font-size:38px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.4));position:relative;}
  .banner-sm{height:64px;}
  .banner-sm .banner-emoji{font-size:26px;}
  .card{overflow:hidden;padding:0 !important;}
  .card-body{padding:16px 18px 18px;}

  /* ---- banner de detalhe do torneio ---- */
  .detail-banner{position:relative;overflow:hidden;border-radius:var(--radius);padding:24px clamp(18px,4vw,34px);margin-bottom:22px;color:#fff;box-shadow:var(--shadow);}
  .detail-banner::after{content:'';position:absolute;inset:0;background-image:
    radial-gradient(circle at 90% -10%, rgba(255,255,255,.22), transparent 45%),
    radial-gradient(circle at 5% 120%, rgba(0,0,0,.3), transparent 55%);}
  .detail-banner .inner{position:relative;}
  .detail-banner .tag{background:rgba(255,255,255,.22);color:#fff;}
  .detail-banner h1{color:#fff;-webkit-text-fill-color:#fff;background:none;font-size:clamp(28px,5vw,42px);margin:4px 0;}
  .detail-banner .muted{color:rgba(255,255,255,.82);}
  .detail-banner .emoji-lg{position:absolute;right:18px;bottom:-6px;font-size:74px;opacity:.28;filter:drop-shadow(0 6px 10px rgba(0,0,0,.3));}

  .empty{padding:40px 20px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:var(--radius);}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--surface-2);
    border:1px solid var(--border);padding:11px 18px;border-radius:9px;font-size:14px;
    box-shadow:0 8px 24px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .2s;
    max-width:calc(100vw - 32px);text-align:center;
  }
  .toast.show{opacity:1;}
  .section-title{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin:6px 0 16px;flex-wrap:wrap;}
  .tabs-inline{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
  .tabs-inline button{background:var(--surface);border:1px solid var(--border);color:var(--muted);padding:7px 14px;border-radius:20px;font-size:13px;font-weight:600;transition:.15s;}
  .tabs-inline button:hover{color:var(--text);}
  .tabs-inline button.active{background:var(--gold);color:#0A0A0A;border-color:var(--gold);font-weight:800;}
  .player-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .player-list span{background:var(--surface-2);border-radius:6px;padding:3px 8px;font-size:12.5px;color:var(--muted);}

  /* ---- animações de entrada ---- */
  @keyframes cardIn{ from{opacity:0;transform:translateY(14px);} to{opacity:1;transform:translateY(0);} }
  .card{animation:cardIn .45s ease both;}
  @keyframes fadeUp{ from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:translateY(0);} }
  .hero-banner,.detail-banner{animation:fadeUp .5s ease both;}

  /* ---- ticker de partidas ao vivo ---- */
  .ticker-wrap{
    overflow:hidden;background:var(--surface);border:1px solid var(--border);border-radius:8px;
    margin:0 0 clamp(18px,3vw,26px);padding:9px 0;white-space:nowrap;display:none;
  }
  .ticker-track{display:inline-flex;gap:36px;animation:ticker-scroll 26s linear infinite;padding-left:24px;}
  .ticker-wrap:hover .ticker-track{animation-play-state:paused;}
  .ticker-track span.ticker-item{font-size:12.5px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.3px;display:inline-flex;align-items:center;gap:8px;}
  .ticker-track span.ticker-dot{color:var(--border);}
  @keyframes ticker-scroll{ from{transform:translateX(0);} to{transform:translateX(-50%);} }

  /* ---- conectores do chaveamento ---- */
  .pair{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:20px;}
  .pair::after{
    content:'';position:absolute;right:-17px;top:38px;bottom:38px;width:17px;
    border-top:2px solid rgba(198,255,26,.35);border-bottom:2px solid rgba(198,255,26,.35);
    border-right:2px solid rgba(198,255,26,.35);border-radius:0 6px 6px 0;
  }
  .match.decidido{box-shadow:inset 0 0 0 1px rgba(198,255,26,.3);}

  /* ---- pódio do ranking ---- */
  .podium{display:flex;align-items:flex-end;gap:12px;margin-bottom:24px;}
  .podium-spot{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 12px;text-align:center;position:relative;animation:fadeUp .5s ease both;}
  .podium-spot .medal{font-size:32px;display:block;margin-bottom:6px;}
  .podium-spot .nome{font-family:'Barlow Condensed';font-weight:700;font-size:18px;}
  .podium-spot .vit{color:var(--gold);font-weight:800;font-size:13px;margin-top:4px;}
  .podium-spot.first{padding-top:26px;border-color:rgba(198,255,26,.4);box-shadow:0 0 0 1px rgba(198,255,26,.25),var(--shadow);order:2;}
  .podium-spot.second{order:1;padding-top:12px;}
  .podium-spot.third{order:3;padding-top:8px;}

  .nivel-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;padding:3px 8px;border-radius:4px;text-transform:uppercase;letter-spacing:.3px;}
  .nivel-bronze{background:#5A3A1E;color:#F0B27A;}
  .nivel-prata{background:#3A3D42;color:#D8DCE2;}
  .nivel-ouro{background:#5A4E0E;color:#FFE066;}
  .nivel-diamante{background:#0E4A54;color:#66F0FF;}

  @media (max-width:640px){
    .topbar{gap:10px;}
    .brand{order:1;}
    .session{order:2;margin-left:0;width:auto;}
    nav{order:3;}
    .btn{padding:8px 13px;font-size:13.5px;}
    .card{padding:15px;}
    .form-box{padding:16px;}
  }
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div class="brand"><div class="mark">e</div><div class="word">e-Expedition</div></div>
    <nav id="mainNav"></nav>
    <div class="session" id="sessionBox"></div>
  </div>
  <div class="ticker-wrap" id="tickerWrap"></div>
  <div id="view"></div>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" onerror="this.onerror=null;this.src='https://unpkg.com/@supabase/supabase-js@2';"></script>
<script>
/* ================= supabase ================= */
const SUPABASE_URL = 'https://numvmwpcbmjwyezezpsy.supabase.co';
const SUPABASE_KEY = 'sb_publishable_9OinOVOKllBA_e_U5sU5_Q_PPXi2osU';
let db;

function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(window._tt); window._tt=setTimeout(()=>t.classList.remove('show'),2200); }
function h(html){
  const d=document.createElement('div');
  d.innerHTML=html.trim();
  return d.children.length===1 ? d.firstElementChild : d;
}
function animateCounters(container){
  container.querySelectorAll('[data-count]').forEach(el=>{
    const target = parseInt(el.dataset.count,10)||0;
    const start = performance.now();
    const duration = 700;
    function step(now){
      const p = Math.min((now-start)/duration,1);
      el.textContent = Math.round(p*target);
      if(p<1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
}
function renderTicker(){
  const wrap = document.getElementById('tickerWrap');
  if(!wrap) return;
  const items = [];
  state.torneios.forEach(t=>{
    if(t.status!=='andamento' || !t.partidas) return;
    t.partidas.forEach(m=>{
      if(m.timeA && m.timeB && !m.vencedor){
        items.push(`⚡ ${m.timeA.nome} vs ${m.timeB.nome} — ${t.nome}`);
      }
    });
  });
  if(items.length===0){ wrap.style.display='none'; wrap.innerHTML=''; return; }
  wrap.style.display='block';
  const itemsHtml = items.map(i=>`<span class="ticker-item">${i}</span>`).join('<span class="ticker-dot">•</span>');
  wrap.innerHTML = `<div class="ticker-track">${itemsHtml}<span class="ticker-dot">•</span>${itemsHtml}</div>`;
}

/* ================= app state ================= */
const state = {
  tab: 'torneios',
  user: null,        // {id, email, nome, role}
  torneios: [],
  times: [],
  torneioAtivo: null,
};

const JOGOS = ['FIFA','League of Legends','Valorant','CS2','Free Fire','Outro'];

const GAME_THEME = {
  'FIFA':               {grad:'linear-gradient(135deg,#12A150 0%,#0A5C33 60%,#063D22 100%)', emoji:'⚽'},
  'League of Legends':  {grad:'linear-gradient(135deg,#5B3CE0 0%,#3B2394 60%,#1B1440 100%)', emoji:'⚔️'},
  'Valorant':           {grad:'linear-gradient(135deg,#E23A5A 0%,#A31E3A 60%,#4A0E1C 100%)', emoji:'🎯'},
  'CS2':                {grad:'linear-gradient(135deg,#5B7285 0%,#33465A 60%,#141C24 100%)', emoji:'💣'},
  'Free Fire':          {grad:'linear-gradient(135deg,#F5920E 0%,#C9560A 60%,#6B2A0A 100%)', emoji:'🔥'},
  'Outro':              {grad:'linear-gradient(135deg,#9B82FF 0%,#6C4CD9 60%,#241C4A 100%)', emoji:'🏆'}
};
function gameTheme(jogo){ return GAME_THEME[jogo] || GAME_THEME['Outro']; }

/* ================= auth ================= */
async function refreshUser(){
  const { data:{ session } } = await db.auth.getSession();
  if(!session){ state.user = null; return; }
  const { data: adminRow } = await db.from('admins').select('user_id').eq('user_id', session.user.id).maybeSingle();
  state.user = {
    id: session.user.id,
    email: session.user.email,
    nome: (session.user.user_metadata && session.user.user_metadata.nome) || session.user.email.split('@')[0],
    role: adminRow ? 'admin' : 'jogador'
  };
}

/* ================= data load ================= */
async function loadTorneios(){
  const { data, error } = await db.from('torneios').select('*').order('created_at', {ascending:true});
  if(error){ console.error(error); toast('Erro ao carregar campeonatos'); return; }
  state.torneios = (data||[]).map(t=>({...t, times: t.times||[], partidas: t.partidas||null}));
}
async function loadTimes(){
  const { data, error } = await db.from('times').select('*').order('created_at', {ascending:true});
  if(error){ console.error(error); toast('Erro ao carregar times'); return; }
  state.times = (data||[]).map(tm=>({...tm, jogadores: tm.jogadores||[]}));
}
async function loadAll(){
  await refreshUser();
  await Promise.all([loadTorneios(), loadTimes()]);
}

/* ================= writes (Supabase) ================= */
async function saveTorneio(t){
  const { error } = await db.from('torneios').update({status:t.status, times:t.times, partidas:t.partidas}).eq('id', t.id);
  if(error){ console.error(error); toast('Erro ao salvar torneio'); }
}
async function criarTorneio(nome, jogo){
  const { error } = await db.from('torneios').insert({nome, jogo});
  if(error){ console.error(error); toast('Erro ao criar campeonato (você precisa ser admin)'); return false; }
  await loadTorneios();
  return true;
}
async function excluirTorneio(id){
  const { error } = await db.from('torneios').delete().eq('id', id);
  if(error){ console.error(error); toast('Erro ao excluir campeonato'); return; }
  await loadTorneios();
}
async function criarTime(nome, jogo, jogadores){
  const { error } = await db.from('times').insert({nome, jogo, jogadores, dono: state.user.id});
  if(error){ console.error(error); toast('Erro ao criar time'); return false; }
  await loadTimes();
  return true;
}
async function excluirTime(id){
  const { error } = await db.from('times').delete().eq('id', id);
  if(error){ console.error(error); toast('Erro ao remover time'); return; }
  state.torneios.forEach(t=> t.times = (t.times||[]).filter(x=>x!==id));
  await loadTimes();
}

/* ================= bracket logic ================= */
function nextPow2(n){ let p=1; while(p<n) p*=2; return p; }

function gerarChaveamento(times){
  const shuffled = [...times].sort(()=>Math.random()-0.5);
  const size = nextPow2(Math.max(shuffled.length,2));
  while(shuffled.length < size) shuffled.push(null);
  const totalRounds = Math.log2(size);
  const matches = [];
  let idCounter = 0;
  for(let i=0;i<size/2;i++){
    matches.push({id: idCounter++, round:0, pos:i, timeA: shuffled[i*2], timeB: shuffled[i*2+1], vencedor:null, scoreA:'', scoreB:''});
  }
  for(let r=1;r<totalRounds;r++){
    const count = size/Math.pow(2,r+1);
    for(let i=0;i<count;i++){
      matches.push({id: idCounter++, round:r, pos:i, timeA:null, timeB:null, vencedor:null, scoreA:'', scoreB:''});
    }
  }
  resolveByes(matches, totalRounds);
  return matches;
}

function resolveByes(matches, totalRounds){
  for(let r=0;r<totalRounds;r++){
    matches.filter(m=>m.round===r).forEach(m=>{
      if(m.vencedor) return;
      if(m.timeA && !m.timeB){ setVencedor(matches, m, m.timeA, totalRounds); }
      else if(m.timeB && !m.timeA){ setVencedor(matches, m, m.timeB, totalRounds); }
    });
  }
}

function setVencedor(matches, match, timeVencedor, totalRounds){
  match.vencedor = timeVencedor;
  if(match.round+1 >= totalRounds) return;
  const nextPos = Math.floor(match.pos/2);
  const next = matches.find(m=>m.round===match.round+1 && m.pos===nextPos);
  if(!next) return;
  if(match.pos % 2 === 0) next.timeA = timeVencedor; else next.timeB = timeVencedor;
  if(next.timeA && !next.timeB) setVencedor(matches, next, next.timeA, totalRounds);
  else if(next.timeB && !next.timeA) setVencedor(matches, next, next.timeB, totalRounds);
}

/* ================= rendering ================= */
function renderNav(){
  const nav = document.getElementById('mainNav');
  const tabs = [['torneios','Torneios'],['times','Times'],['ranking','Ranking']];
  if(state.user && state.user.role==='admin') tabs.push(['admin','Admin']);
  nav.innerHTML = tabs.map(([id,label])=>`<button data-tab="${id}" class="${state.tab===id?'active':''}">${label}</button>`).join('');
  nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{ state.tab=b.dataset.tab; state.torneioAtivo=null; render(); });

  const sb = document.getElementById('sessionBox');
  if(state.user){
    sb.innerHTML = `<span>Olá, <b>${state.user.nome}</b> ${state.user.role==='admin'?'(admin)':''}</span><button class="btn btn-ghost" id="logoutBtn">Sair</button>`;
    document.getElementById('logoutBtn').onclick = async ()=>{ await db.auth.signOut(); state.user=null; state.tab='torneios'; render(); };
  } else {
    sb.innerHTML = `<button class="btn btn-gold" id="loginBtn">Entrar</button>`;
    document.getElementById('loginBtn').onclick = ()=>{ state.tab='login'; render(); };
  }
}

function render(){
  renderNav();
  renderTicker();
  const view = document.getElementById('view');
  view.innerHTML = '';
  if(state.tab==='login') return renderLogin(view);
  if(state.tab==='torneios') return state.torneioAtivo ? renderTorneioDetalhe(view) : renderTorneios(view);
  if(state.tab==='times') return renderTimes(view);
  if(state.tab==='ranking') return renderRanking(view);
  if(state.tab==='admin') return renderAdmin(view);
}

/* ---- login / cadastro ---- */

    <div class="hero" style="padding-top:10px;">
      <h1 style="font-size:38px;">Entrar</h1>
      <p>Acesse com sua conta para inscrever times e acompanhar seus torneios.</p>

        <div class="field"><label>Senha</label><input id="lp" type="password"/></div>
        <button class="btn btn-gold" id="loginSubmit" style="width:100%;">Entrar</button>
      </div>
      <div class="form-box">
        <h3 style="margin-top:0;">Criar conta</h3>
        <div class="field"><label>Nome de exibição</label><input id="rn"/></div>
        <div class="field"><label>E-mail</label><input id="ru" type="email"/></div>
        <div class="field"><label>Senha</label><input id="rp" type="password"/></div>
        <button class="btn btn-ghost" id="regSubmit" style="width:100%;">Criar conta</button>
      </div>
    </div>
  `));
  document.getElementById('loginSubmit').onclick = async ()=>{
    const email=document.getElementById('lu').value.trim(), senha=document.getElementById('lp').value;
    if(!email||!senha){ toast('Preencha e-mail e senha'); return; }
    const { error } = await db.auth.signInWithPassword({email, password:senha});
    if(error){ toast('E-mail ou senha inválidos'); return; }
    await loadAll();
    state.tab='torneios'; render(); toast('Bem-vindo!');
  };
  document.getElementById('regSubmit').onclick = async ()=>{
    const nome=document.getElementById('rn').value.trim();
    const email=document.getElementById('ru').value.trim(), senha=document.getElementById('rp').value;
    if(!nome||!email||!senha){ toast('Preencha todos os campos'); return; }
    if(senha.length<6){ toast('A senha precisa ter ao menos 6 caracteres'); return; }
    const { data, error } = await db.auth.signUp({email, password:senha, options:{data:{nome}}});
    if(error){ toast(error.message); return; }
    if(data.session){
      await loadAll();
      state.tab='torneios'; render(); toast('Conta criada, bem-vindo!');
    } else {
      toast('Conta criada! Confirme seu e-mail antes de entrar.');
      state.tab='login'; render();

  };
}

/* ---- torneio detalhe (inscrição + bracket) ---- */
function renderTorneioDetalhe(view){
  const t = state.torneios.find(x=>x.id===state.torneioAtivo);
  if(!t){ state.torneioAtivo=null; return renderTorneios(view); }
  const statusLabel = {aberto:'Inscrições abertas', andamento:'Em andamento', finalizado:'Finalizado'};
  const theme = gameTheme(t.jogo);

  view.appendChild(h(`
    <button class="btn btn-ghost" id="backBtn" style="margin-bottom:16px;">&larr; Voltar</button>
    <div class="detail-banner" style="background:${theme.grad}">
      <div class="inner">
        <span class="tag status-${t.status}">${statusLabel[t.status]}</span>
        <h1>${t.nome}</h1>
        <div class="muted">${t.jogo}</div>
      </div>
      <span class="emoji-lg">${theme.emoji}</span>
    </div>
  `));
  document.getElementById('backBtn').onclick=()=>{ state.torneioAtivo=null; render(); };

  if(t.status==='aberto'){
    const meusTimes = state.times.filter(tm=> tm.jogo===t.jogo && tm.dono===(state.user?state.user.id:'__none__'));
    const disponiveis = meusTimes.filter(tm=>!(t.times||[]).includes(tm.id));
    const wrap = h(`<div class="card" style="max-width:460px;margin-bottom:24px;"><div class="card-body"><h3 style="margin-top:0;">Inscrever time</h3></div></div>`);
    const body = wrap.querySelector('.card-body');
    if(!state.user){
      body.appendChild(h(`<div class="muted">Faça login para inscrever um time.</div>`));
    } else if(meusTimes.length===0){
      body.appendChild(h(`<div class="muted">Você ainda não tem um time de ${t.jogo}. Crie um na aba Times.</div>`));
    } else if(disponiveis.length===0){
      body.appendChild(h(`<div class="muted">Todos os seus times de ${t.jogo} já estão inscritos.</div>`));
    } else {
      const sel = h(`<select id="timeSel">${disponiveis.map(tm=>`<option value="${tm.id}">${tm.nome}</option>`).join('')}</select>`);
      body.appendChild(sel);
      const btn = h(`<button class="btn btn-gold" style="margin-top:12px;width:100%;">Inscrever</button>`);
      btn.onclick = async ()=>{
        t.times = [...(t.times||[]), sel.value];
        await saveTorneio(t);
        toast('Time inscrito!');
        render();
      };
      body.appendChild(btn);
    }
    view.appendChild(wrap);
  }

  view.appendChild(h(`<h3>Times inscritos (${(t.times||[]).length})</h3>`));
  const listBox = h(`<div class="player-list" style="margin-bottom:22px;"></div>`);
  (t.times||[]).forEach(id=>{
    const tm = state.times.find(x=>x.id===id);
    if(tm) listBox.appendChild(h(`<span>${tm.nome}</span>`));
  });
  if(!t.times || t.times.length===0) listBox.appendChild(h(`<span>Nenhum time ainda</span>`));
  view.appendChild(listBox);

  if(state.user && state.user.role==='admin'){
    const actions = h(`<div style="margin-bottom:24px;display:flex;gap:10px;flex-wrap:wrap;"></div>`);
    if(t.status==='aberto'){
      const genBtn = h(`<button class="btn btn-gold">Fechar inscrições e gerar chaveamento</button>`);
      genBtn.disabled = (t.times||[]).length < 2;
      if(genBtn.disabled) genBtn.title='Precisa de ao menos 2 times';
      genBtn.onclick = async ()=>{
        const timesObjs = t.times.map(id=>state.times.find(x=>x.id===id)).filter(Boolean);
        t.partidas = gerarChaveamento(timesObjs.map(tm=>({id:tm.id, nome:tm.nome})));
        t.status='andamento';
        await saveTorneio(t);
        toast('Chaveamento gerado!');
        render();
      };
      actions.appendChild(genBtn);
    }
    if(t.status==='andamento'){
      const finBtn = h(`<button class="btn btn-ghost">Marcar torneio como finalizado</button>`);
      finBtn.onclick = async ()=>{ t.status='finalizado'; await saveTorneio(t); render(); };
      actions.appendChild(finBtn);
    }
    const delBtn = h(`<button class="btn btn-danger">Excluir torneio</button>`);
    delBtn.onclick = async ()=>{
      if(!confirm('Excluir este torneio?')) return;
      await excluirTorneio(t.id);
      state.torneioAtivo=null; render();
    };
    actions.appendChild(delBtn);
    view.appendChild(actions);
  }

  if(t.partidas && t.partidas.length){
    view.appendChild(h(`<h3>Chaveamento</h3>`));
    view.appendChild(renderBracket(t));
  }
}

function renderBracket(t){
  const totalRounds = Math.max(...t.partidas.map(m=>m.round)) + 1;
  const wrap = h(`<div class="bracket"></div>`);
  const roundNames = (r)=>{
    const left = totalRounds - r;
    if(left===1) return 'Final';
    if(left===2) return 'Semifinal';
    if(left===3) return 'Quartas';
    return 'Rodada '+(r+1);
  };
  for(let r=0;r<totalRounds;r++){
    const col = h(`<div class="round-col"><div class="round-title">${roundNames(r)}</div></div>`);
    const matchesRound = t.partidas.filter(m=>m.round===r).sort((a,b)=>a.pos-b.pos);
    const isLast = r===totalRounds-1;
    let pairContainer = null;
    matchesRound.forEach((m,idx)=>{
      const nameA = m.timeA ? m.timeA.nome : (m.timeB===null&&m.timeA===null? 'A definir' : '—');
      const nameB = m.timeB ? m.timeB.nome : (m.timeA===null&&m.timeB===null? 'A definir' : '—');
      const editable = state.user && state.user.role==='admin' && m.timeA && m.timeB && !m.vencedor;
      const matchEl = h(`<div class="match ${m.vencedor?'decidido':''}">
        <div class="slot ${m.vencedor && m.vencedor.id===(m.timeA&&m.timeA.id) ? 'win':''} ${!m.timeA?'bye':''}">
          <span class="name">${nameA}</span>
          ${editable ? `<input type="number" min="0" data-side="A" value="${m.scoreA}"/>` : (m.timeA? `<span>${m.scoreA!==''?m.scoreA:''}</span>`:'')}
        </div>
        <div class="slot ${m.vencedor && m.vencedor.id===(m.timeB&&m.timeB.id) ? 'win':''} ${!m.timeB?'bye':''}">
          <span class="name">${nameB}</span>
          ${editable ? `<input type="number" min="0" data-side="B" value="${m.scoreB}"/>` : (m.timeB? `<span>${m.scoreB!==''?m.scoreB:''}</span>`:'')}
        </div>
      </div>`);
      if(editable){
        matchEl.appendChild(h(`<button class="btn btn-ghost" style="width:100%;border-radius:0;font-size:12px;padding:6px;">Confirmar resultado</button>`));
        const confirmBtn = matchEl.lastElementChild;
        confirmBtn.onclick = async ()=>{
          const sa = matchEl.querySelector('[data-side="A"]').value;
          const sb = matchEl.querySelector('[data-side="B"]').value;
          if(sa===''||sb===''||sa===sb){ toast('Informe um placar válido (sem empate)'); return; }
          m.scoreA=sa; m.scoreB=sb;
          const vencedor = Number(sa)>Number(sb) ? m.timeA : m.timeB;
          setVencedor(t.partidas, m, vencedor, totalRounds);
          await saveTorneio(t);
          toast('Resultado salvo');
          render();
        };
      }
      if(isLast){
        col.appendChild(matchEl);
      } else {
        if(idx%2===0){
          pairContainer = h('<div class="pair"></div>');
          col.appendChild(pairContainer);
        }
        pairContainer.appendChild(matchEl);
      }
    });
    wrap.appendChild(col);
  }
  return wrap;
}

/* ---- ranking ---- */
function renderRanking(view){
  view.appendChild(h(`<div class="section-title"><h1 style="font-size:34px;margin:0;">Ranking</h1></div>`));
  const jogoFiltro = state._rankJogo || 'Todos';
  const tabs = h(`<div class="tabs-inline"></div>`);
  ['Todos', ...JOGOS].forEach(g=>{
    const b = h(`<button class="${jogoFiltro===g?'active':''}">${g}</button>`);
    b.onclick = ()=>{ state._rankJogo=g; render(); };
    tabs.appendChild(b);
  });
  view.appendChild(tabs);

  const stats = {};
  state.torneios.forEach(t=>{
    if(!t.partidas) return;
    if(jogoFiltro!=='Todos' && t.jogo!==jogoFiltro) return;
    t.partidas.forEach(m=>{
      if(!m.vencedor || !m.timeA || !m.timeB) return;
      [m.timeA, m.timeB].forEach(tm=>{
        if(!stats[tm.id]) stats[tm.id] = {nome:tm.nome, jogo:t.jogo, v:0, d:0};
      });
      const perdedor = m.vencedor.id===m.timeA.id ? m.timeB : m.timeA;
      stats[m.vencedor.id].v++;
      stats[perdedor.id].d++;
    });
  });
  const rows = Object.values(stats).sort((a,b)=>b.v-a.v || a.d-b.d);
  if(rows.length===0){ view.appendChild(h(`<div class="empty">Ainda não há partidas concluídas para gerar ranking.</div>`)); return; }

  function nivelDoTime(v){
    if(v>=10) return {cls:'nivel-diamante', label:'Diamante', icon:'💎'};
    if(v>=5)  return {cls:'nivel-ouro', label:'Ouro', icon:'🟡'};
    if(v>=2)  return {cls:'nivel-prata', label:'Prata', icon:'⚪'};
    return {cls:'nivel-bronze', label:'Bronze', icon:'🟤'};
  }

  if(rows.length>=2){
    const podium = h('<div class="podium"></div>');
    const medals = ['🥇','🥈','🥉'];
    const classes = ['first','second','third'];
    rows.slice(0,3).forEach((r,i)=>{
      podium.appendChild(h(`<div class="podium-spot ${classes[i]}" style="animation-delay:${i*0.08}s;">
        <span class="medal">${medals[i]}</span>
        <div class="nome">${r.nome}</div>
        <div class="muted" style="font-size:12px;">${r.jogo}</div>
        <div class="vit">${r.v} vitórias</div>
      </div>`));
    });
    view.appendChild(podium);
  }

  const table = h(`<table><thead><tr><th>#</th><th>Time</th><th>Jogo</th><th>Nível</th><th>Vitórias</th><th>Derrotas</th></tr></thead><tbody></tbody></table>`);
  const tbody = table.querySelector('tbody');
  rows.forEach((r,i)=>{
    const nv = nivelDoTime(r.v);
    tbody.appendChild(h(`<tr><td>${i+1}</td><td>${r.nome}</td><td>${r.jogo}</td><td><span class="nivel-badge ${nv.cls}">${nv.icon} ${nv.label}</span></td><td>${r.v}</td><td>${r.d}</td></tr>`));
  });
  const wrapTable = h('<div class="table-wrap"></div>');
  wrapTable.appendChild(table);
  view.appendChild(wrapTable);
}

    if(ok){ toast('Campeonato criado!'); render(); }
  };
  formWrap.appendChild(btn);
  view.appendChild(formWrap);

  const statusLabel = {aberto:'Inscrições abertas', andamento:'Em andamento', finalizado:'Finalizado'};

  view.appendChild(h(`<h3>Todos os campeonatos (${state.torneios.length})</h3>`));
  if(state.torneios.length===0){
    view.appendChild(h(`<div class="empty" style="margin-bottom:24px;">Nenhum campeonato criado ainda.</div>`));
  } else {
    const table = h(`<table><thead><tr><th>Nome</th><th>Jogo</th><th>Status</th><th>Times</th><th>Ações</th></tr></thead><tbody></tbody></table>`);
    const tbody = table.querySelector('tbody');
    state.torneios.forEach(t=>{
      const tr = h(`<tr>
        <td>${t.nome}</td>
        <td>${t.jogo}</td>
        <td><span class="tag status-${t.status}" style="margin:0;">${statusLabel[t.status]}</span></td>
        <td>${(t.times||[]).length}</td>
      </tr>`);
      const acoesTd = h(`<td></td>`);
      const wrapBtns = h(`<div style="display:flex;gap:6px;flex-wrap:wrap;"></div>`);

      const verBtn = h(`<button class="btn btn-ghost" style="padding:6px 10px;font-size:12.5px;">Ver / chaveamento</button>`);
      verBtn.onclick = ()=>{ state.torneioAtivo = t.id; state.tab='torneios'; render(); };
      wrapBtns.appendChild(verBtn);

      if(t.status==='aberto'){
        const genBtn = h(`<button class="btn btn-gold" style="padding:6px 10px;font-size:12.5px;">Gerar chaveamento</button>`);
        genBtn.disabled = (t.times||[]).length < 2;
        if(genBtn.disabled) genBtn.title='Precisa de ao menos 2 times';
        genBtn.onclick = async ()=>{
          const timesObjs = t.times.map(id=>state.times.find(x=>x.id===id)).filter(Boolean);
          t.partidas = gerarChaveamento(timesObjs.map(tm=>({id:tm.id, nome:tm.nome})));
          t.status='andamento';
          await saveTorneio(t);
          toast('Chaveamento gerado!');
          render();
        };
        wrapBtns.appendChild(genBtn);
      }
      if(t.status==='andamento'){
        const finBtn = h(`<button class="btn btn-ghost" style="padding:6px 10px;font-size:12.5px;">Finalizar</button>`);
        finBtn.onclick = async ()=>{ t.status='finalizado'; await saveTorneio(t); toast('Torneio finalizado'); render(); };
        wrapBtns.appendChild(finBtn);
      }
      const delBtn = h(`<button class="btn btn-danger" style="padding:6px 10px;font-size:12.5px;">Excluir</button>`);
      delBtn.onclick = async ()=>{
        if(!confirm(`Excluir o campeonato "${t.nome}"?`)) return;
        await excluirTorneio(t.id);
        toast('Campeonato excluído');
        render();
      };
      wrapBtns.appendChild(delBtn);

      acoesTd.appendChild(wrapBtns);
      tr.appendChild(acoesTd);
      tbody.appendChild(tr);
    });
    const wrapTable = h('<div class="table-wrap" style="margin-bottom:28px;"></div>');
    wrapTable.appendChild(table);
    view.appendChild(wrapTable);
  }

  view.appendChild(h(`<h3>Todos os times (${state.times.length})</h3>`));
  if(state.times.length===0){
    view.appendChild(h(`<div class="empty" style="margin-bottom:24px;">Nenhum time cadastrado ainda.</div>`));
  } else {
    const table2 = h(`<table><thead><tr><th>Nome</th><th>Jogo</th><th>Jogadores</th><th>Ações</th></tr></thead><tbody></tbody></table>`);
    const tbody2 = table2.querySelector('tbody');
    state.times.forEach(tm=>{
      const tr = h(`<tr>
        <td>${tm.nome}</td>
        <td>${tm.jogo}</td>
        <td>${(tm.jogadores||[]).join(', ') || '—'}</td>
      </tr>`);
      const acoesTd = h(`<td></td>`);
      const delBtn = h(`<button class="btn btn-danger" style="padding:6px 10px;font-size:12.5px;">Remover</button>`);
      delBtn.onclick = async ()=>{
        if(!confirm(`Remover o time "${tm.nome}"?`)) return;
        await excluirTime(tm.id);
        toast('Time removido');
        render();
      };
      acoesTd.appendChild(delBtn);
      tr.appendChild(acoesTd);
      tbody2.appendChild(tr);
    });
    const wrapTable2 = h('<div class="table-wrap" style="margin-bottom:28px;"></div>');
    wrapTable2.appendChild(table2);
    view.appendChild(wrapTable2);
  }

  view.appendChild(h(`<div class="card"><div class="card-body">
    <h3 style="margin-top:0;">Como promover um admin</h3>
    <p class="muted" style="margin:0;">Peça pro jogador criar a conta dele no site. Depois, no painel do Supabase, vá em <b>Authentication → Users</b>, copie o ID dele e adicione uma linha na tabela <b>admins</b> (aba Table Editor) com esse ID.</p>
  </div></div>`));
}

/* ================= boot ================= */
(async function boot(){
  const view = document.getElementById('view');
  view.innerHTML = '<div class="empty">Carregando…</div>';
  try{
    if(!window.supabase){
      throw new Error('A biblioteca do Supabase não carregou. Verifique sua conexão ou desative bloqueadores de anúncio/rastreador para este site e recarregue a página.');
    }
    db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    await loadAll();
    render();
  }catch(err){
    console.error(err);
    view.innerHTML = '<div class="empty">⚠️ Erro ao carregar o site.<br><br>'+(err && err.message ? err.message : String(err))+'</div>';
  }
})();
</script>
</body>
</html>
