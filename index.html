];

function pickFeaturedTorneio(){
  const andamentoList = state.torneios.filter(t=>t.status==='andamento');
  if(andamentoList.length){
    // prioriza o que tem partidas pendentes
    const withPending = andamentoList.find(t=> (t.partidas||[]).some(m=>m.timeA&&m.timeB&&!m.vencedor&&m.scoreA===''));
    return withPending || andamentoList[0];
  }
  const abertosList = state.torneios.filter(t=>t.status==='aberto');
  if(abertosList.length){
    return [...abertosList].sort((a,b)=>{
      const da = a.data_inicio ? new Date(a.data_inicio).getTime() : Infinity;
      const db = b.data_inicio ? new Date(b.data_inicio).getTime() : Infinity;
      return da - db;
    })[0];
  }
  return null;
}

function proximosJogos(t, limit=2){
  return (t.partidas||[])
    .filter(m=> m.timeA && m.timeB && !m.vencedor && (m.scoreA===''||m.scoreA==null))
    .sort((a,b)=> (a.round-b.round) || (a.pos-b.pos))
    .slice(0, limit);
}

function quoteDoDia(seed){
  let n = 0;
  String(seed||'').split('').forEach(c=> n = (n + c.charCodeAt(0)*7) % 997);
  const day = Math.floor(Date.now()/86400000);
  return GAMER_QUOTES[(n + day) % GAMER_QUOTES.length];
}

function renderFeaturedTorneio(t){
  const statusLabel = {aberto:'Inscrições abertas', andamento:'Acontecendo agora', finalizado:'Finalizado'};
  const theme = gameTheme(t.jogo);
  const wrap = h(`<div class="featured"></div>`);
  const inner = h(`<div class="featured-inner"></div>`);

  const main = h(`<div class="featured-main"></div>`);
  main.style.background = `linear-gradient(120deg, rgba(10,12,14,.88), rgba(10,12,14,.55)), ${theme.grad}`;

  main.appendChild(h(`<span class="tag status-${t.status}">${statusLabel[t.status]||t.status}</span>`));
  main.appendChild(h(`<h2>${t.nome}</h2>`));
  main.appendChild(h(`<p class="featured-meta">${t.jogo} · ${(t.times||[]).length} inscrito(s) · ${({mata_mata:'Mata-mata',grupos_mata_mata:'Grupos + MM',pontos:'Pontos',dupla_eliminacao:'Dupla elim.'}[t.formato]||'Mata-mata')}</p>`));

  if(t.status==='aberto'){
    const q = quoteDoDia(t.id||t.nome);
    main.appendChild(h(`<blockquote class="featured-quote">“${q.text}”<cite>${q.cite}</cite></blockquote>`));
    if(t.data_inicio){
      const cd = formatCountdown(t.data_inicio);
      if(cd) main.appendChild(h(`<p class="featured-meta" style="margin-top:10px;color:var(--gold);font-weight:700;">Começa em ${cd}</p>`));
    }
  }

  const actions = h(`<div class="featured-actions"></div>`);
  const openBtn = h(`<button class="btn btn-gold">${t.status==='aberto'?'Ver e inscrever-se':'Acompanhar'}</button>`);
  openBtn.onclick = ()=>{ state.torneioAtivo = t.id; state._editandoTorneio=false; render(); };
  actions.appendChild(openBtn);
  main.appendChild(actions);
  inner.appendChild(main);

  const side = h(`<div class="featured-side"></div>`);
  if(t.status==='andamento'){
    side.appendChild(h(`<h4>Próximos jogos</h4>`));
    const next = proximosJogos(t, 2);
    if(next.length===0){
      side.appendChild(h(`<p class="muted" style="margin:0;font-size:13px;">Nenhum jogo pendente no momento — confira o chaveamento.</p>`));
    } else {
      next.forEach(m=>{
        side.appendChild(h(`<div class="next-match"><span class="nm">${m.timeA.nome}</span><span class="vs">VS</span><span class="nm" style="text-align:right">${m.timeB.nome}</span></div>`));
      });
    }
  } else if(t.status==='aberto'){
    side.appendChild(h(`<h4>Por que entrar</h4>`));
    side.appendChild(h(`<p class="muted" style="margin:0 0 10px;font-size:13px;line-height:1.45;">Inscrição com seu nome de exibição. Uma vaga por pessoa. Mostre seu nível.</p>`));
    const inscritos = (t.times||[]).map(id=>state.times.find(x=>x.id===id)).filter(Boolean).slice(0,6);
    if(inscritos.length){
      const row = h(`<div style="display:flex;gap:4px;flex-wrap:wrap;"></div>`);
      inscritos.forEach(tm=> row.appendChild(h(avatarHTML({nome:tm.nome, avatar:tm.avatar}))));
      if((t.times||[]).length > inscritos.length){
        row.appendChild(h(`<span class="avatar-initials" style="width:28px;height:28px;font-size:11px;">+${(t.times||[]).length-inscritos.length}</span>`));
      }
      side.appendChild(row);
    } else {
      side.appendChild(h(`<p class="muted" style="margin:0;font-size:13px;">Seja o primeiro a se inscrever.</p>`));
    }
  }
  inner.appendChild(side);
  wrap.appendChild(inner);
  return wrap;
}

/* ---- torneios (lista) ---- */
function renderTorneios(view){
  const abertos = state.torneios.filter(t=>t.status==='aberto').length;
  const andamento = state.torneios.filter(t=>t.status==='andamento').length;
  const finalizados = state.torneios.filter(t=>t.status==='finalizado').length;

  // destaque do campeonato que está rolando / aberto
  const featured = pickFeaturedTorneio();
  if(featured){
    view.appendChild(renderFeaturedTorneio(featured));
  }

  // filtros por status
  const filters = [
    ['aberto', 'Abertos', abertos],
    ['andamento', 'Acontecendo', andamento],
    ['finalizado', 'Finalizados', finalizados],
    ['todos', 'Todos', state.torneios.length]
  ];
  if(!state.homeFilter) state.homeFilter = 'aberto';
  // se filtro atual está vazio, cai para o primeiro com itens (exceto se usuário escolheu conscientemente)
  const bar = h(`<div class="home-filters"></div>`);
  filters.forEach(([id, label, count])=>{
    const b = h(`<button type="button" class="${state.homeFilter===id?'active':''}">${label}<span class="count">${count}</span></button>`);
    b.onclick = ()=>{ state.homeFilter = id; render(); };
    bar.appendChild(b);
  });
  view.appendChild(bar);

  let lista = state.torneios;
  if(state.homeFilter !== 'todos'){
    lista = state.torneios.filter(t=>t.status===state.homeFilter);
  }

  const box = h(`<div class="grid" id="torneiosGrid"></div>`);
  view.appendChild(box);

  if(state.torneios.length===0){
    box.replaceWith(h(`<div class="empty">Nenhum campeonato criado ainda. ${state.user && state.user.role==='admin' ? 'Vá em Admin para criar o primeiro.' : ''}</div>`));
    return;
  }
  if(lista.length===0){
    const msgs = {
      aberto: 'Nenhum campeonato com inscrições abertas no momento.',
      andamento: 'Nenhum campeonato em andamento agora.',
      finalizado: 'Nenhum campeonato finalizado ainda.'
    };
    box.replaceWith(h(`<div class="empty">${msgs[state.homeFilter]||'Nada por aqui.'}</div>`));
    return;
  }

  const statusLabel = {aberto:'Inscrições abertas', andamento:'Em andamento', finalizado:'Finalizado'};
  lista.forEach((t,i)=>{
    const theme = gameTheme(t.jogo);
    let avisoInicio = '';
    if(t.status==='aberto' && t.data_inicio){
      const cd = formatCountdown(t.data_inicio);
      if(cd) avisoInicio = `<div style="color:var(--gold);font-size:12px;font-weight:700;margin-top:4px;">Começa em ${cd}</div>`;
    }
    // mini avatares dos inscritos
    const inscritos = (t.times||[]).map(id=>state.times.find(x=>x.id===id)).filter(Boolean).slice(0,5);
    const extra = Math.max(0, (t.times||[]).length - inscritos.length);
    let faces = inscritos.map(tm=> avatarHTML({nome:tm.nome, avatar:tm.avatar})).join('');
    if(extra>0) faces += `<span class="avatar-initials" style="width:28px;height:28px;font-size:11px;background:var(--surface-2);color:var(--muted);">+${extra}</span>`;
    const facesRow = (t.times||[]).length
      ? `<div style="display:flex;align-items:center;gap:4px;margin-top:10px;flex-wrap:wrap;">${faces}</div>`
      : '';

    const card = h(`
      <div class="card" style="animation-delay:${i*0.06}s;">
        <div class="banner" style="background:${theme.grad}">${gameIconHTML(t.jogo)}</div>
        <div class="card-body">
          <span class="tag status-${t.status}">${statusLabel[t.status]}</span>
          <h3>${t.nome}</h3>
          <div class="muted">${t.jogo} · ${(t.times||[]).length} inscrito(s) · ${({mata_mata:'Mata-mata',grupos_mata_mata:'Grupos',pontos:'Pontos',dupla_eliminacao:'Dupla elim.',livre:'Livre'}[t.formato]||'Mata-mata')}</div>
          ${avisoInicio}
          ${facesRow}
          <div class="row">
            <button class="btn btn-ghost" data-open="${t.id}">Ver detalhes</button>
          </div>
        </div>
      </div>
    `);
    box.appendChild(card);
  });
  box.querySelectorAll('[data-open]').forEach(btn=>btn.onclick=()=>{ state.torneioAtivo = btn.dataset.open; state._editandoTorneio=false; render(); });
  maybeShowMinigame();
}

let countdownInterval = null;
function formatCountdown(dataISO){
  const diff = new Date(dataISO).getTime() - Date.now();
  if(diff<=0) return null;
  const s = Math.floor(diff/1000);
  const d = Math.floor(s/86400), h = Math.floor((s%86400)/3600), m = Math.floor((s%3600)/60);
  if(d>0) return `${d}d ${h}h`;
  if(h>0) return `${h}h ${m}m`;
  return `${m}m`;
}
function exportarCSV(t){
  const linhas = [['Nome','Jogo']];
  (t.times||[]).forEach(id=>{
    const tm = state.times.find(x=>x.id===id);
    if(tm) linhas.push([tm.nome, tm.jogo]);
  });
  const csv = linhas.map(l=>l.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `inscritos-${t.nome}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
async function compartilhar(t){
  const url = new URL(window.location.href);
  url.searchParams.set('torneio', t.id);
  const link = url.toString();
  if(navigator.share){
    try{ await navigator.share({title:t.nome, text:`Confira o campeonato ${t.nome} no e-Expedition!`, url:link}); return; }catch(e){ /* usuário cancelou */ return; }
  }
  try{ await navigator.clipboard.writeText(link); toast('Link copiado!'); }
  catch(e){ toast('Não foi possível copiar o link'); }
}

/* ---- torneio detalhe (inscrição + bracket) ---- */
function renderTorneioDetalhe(view){
  const t = state.torneios.find(x=>x.id===state.torneioAtivo);
  if(countdownInterval){ clearInterval(countdownInterval); countdownInterval=null; }
  if(!t){ state.torneioAtivo=null; return renderTorneios(view); }
  const statusLabel = {aberto:'Inscrições abertas', andamento:'Em andamento', finalizado:'Finalizado'};
  const theme = gameTheme(t.jogo);
  const dataFmt = t.data_inicio ? new Date(t.data_inicio).toLocaleString('pt-BR', {dateStyle:'short', timeStyle:'short'}) : null;

  view.appendChild(h(`
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px;">
      <button class="btn btn-ghost" id="backBtn">&larr; Voltar</button>
      <button class="btn btn-ghost" id="shareBtn">Compartilhar</button>
    </div>
    <div class="detail-banner" style="background:${theme.grad}">
      <div class="inner">
        <span class="tag status-${t.status}">${statusLabel[t.status]}</span>
        <h1>${t.nome}</h1>
        <div class="muted">${t.jogo}${dataFmt ? ' · Início: '+dataFmt : ''}</div>
        <div class="muted" id="countdownText" style="margin-top:6px;font-weight:700;"></div>
      </div>
      ${gameIconHTML(t.jogo, 'lg')}
    </div>
  `));
  document.getElementById('backBtn').onclick=()=>{ state.torneioAtivo=null; state._editandoTorneio=false; render(); };
  document.getElementById('shareBtn').onclick=()=>compartilhar(t);

  if(t.data_inicio){
    const cdEl = document.getElementById('countdownText');
    const tick = ()=>{
      const txt = formatCountdown(t.data_inicio);
      if(!cdEl) { clearInterval(countdownInterval); return; }
      cdEl.textContent = txt ? `Começa em ${txt}` : '';
    };
    tick();
    countdownInterval = setInterval(tick, 30000);
  }

  if(t.regras){
    view.appendChild(h(`<div class="card" style="margin-bottom:20px;"><div class="card-body"><h3 style="margin-top:0;">Regras / Edital</h3><p class="muted" style="white-space:pre-wrap;margin:0;">${t.regras}</p></div></div>`));
  }

  if(t.status==='aberto'){
    const wrap = h(`<div class="card" style="margin-bottom:16px;"><div class="card-body"></div></div>`);
    const body = wrap.querySelector('.card-body');
    body.appendChild(h(`<h3 style="margin-top:0;margin-bottom:8px;">Inscrição</h3>`));
    if(!state.user){
      body.appendChild(h(`<p class="muted" style="margin:0 0 12px;">Entre na sua conta para se inscrever com seu nome de exibição.</p>`));
      const loginBtn = h(`<button class="btn btn-gold">Entrar / Criar conta</button>`);
      loginBtn.onclick = ()=> openLoginModal('login');
      body.appendChild(loginBtn);
    } else {
      const jaInscrito = (t.times||[]).some(id=>{
        const tm = state.times.find(x=>x.id===id);
        return tm && tm.dono===state.user.id;
      });
      if(jaInscrito){
        body.appendChild(h(`<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
          <span class="tag status-aberto" style="margin:0;">Inscrito</span>
          <span class="muted">Você está neste campeonato como <b style="color:var(--text);">${state.user.nome}</b>. Só vale 1 inscrição.</span>
        </div>`));
      } else {
        body.appendChild(h(`<p class="muted" style="margin:0 0 12px;">Você entra <b style="color:var(--text);">uma vez</b> com seu nome de exibição: <b style="color:var(--gold);">${state.user.nome}</b>.</p>`));
        const row = h(`<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;"></div>`);
        const btn = h(`<button class="btn btn-gold">Confirmar inscrição</button>`);
        btn.onclick = ()=> inscreverNoTorneio(t);
        row.appendChild(btn);
        const perfilLink = h(`<button class="btn btn-ghost">Trocar nome no perfil</button>`);
        perfilLink.onclick = ()=>{ state.tab='perfil'; render(); };
        row.appendChild(perfilLink);
        body.appendChild(row);
      }
    }
    view.appendChild(wrap);
  }

  view.appendChild(h(`<div class="section-title" style="margin-bottom:10px;"><h3 style="margin:0;">Inscritos (${(t.times||[]).length})</h3>${state.user && state.user.role==='admin' && (t.times||[]).length>0 ? '<button class="btn btn-ghost" id="csvBtn" style="padding:6px 12px;font-size:12.5px;">⬇ Exportar CSV</button>' : ''}</div>`));
  const csvBtnEl = document.getElementById('csvBtn');
  if(csvBtnEl) csvBtnEl.onclick = ()=> exportarCSV(t);
  const listBox = h(`<div class="player-list" style="margin-bottom:22px;"></div>`);
  (t.times||[]).forEach(id=>{
    const tm = state.times.find(x=>x.id===id);
    if(!tm) return;
    const avatar = (state.user && tm.dono===state.user.id && state.user.avatar) ? state.user.avatar : tm.avatar;
    const isAdmin = state.user && state.user.role==='admin';
    const chip = h(`<div class="player-chip" style="cursor:pointer;">${avatarHTML({nome:tm.nome, avatar})} <span class="chip-name">${tm.nome}</span></div>`);
    chip.querySelector('.chip-name').onclick = ()=> openPerfil(tm.dono);
    chip.querySelector('.avatar-img, .avatar-initials')?.addEventListener('click', ()=> openPerfil(tm.dono));
    if(isAdmin && (t.status==='aberto' || t.status==='andamento')){
      const x = h(`<button type="button" class="chip-x" title="Remover do campeonato">&times;</button>`);
      x.onclick = async (e)=>{
        e.stopPropagation();
        if(!confirm(`Remover "${tm.nome}" deste campeonato?`)) return;
        await removerInscritoDoTorneio(t, tm.id);
      };
      chip.appendChild(x);
    }
    listBox.appendChild(chip);
  });
  if(!t.times || t.times.length===0){
    listBox.appendChild(h(`<div class="muted">Ninguém inscrito ainda</div>`));
  }
  view.appendChild(listBox);

  if(state.user && state.user.role==='admin'){
    const actions = h(`<div style="margin-bottom:24px;display:flex;gap:10px;flex-wrap:wrap;"></div>`);
    if(t.status==='aberto'){
      const genBtn = h(`<button class="btn btn-gold">Fechar inscrições e iniciar torneio</button>`);
      genBtn.disabled = (t.times||[]).length < 2;
      if(genBtn.disabled) genBtn.title='Precisa de ao menos 2 times';
      genBtn.onclick = async ()=>{
        const timesObjs = t.times.map(id=>state.times.find(x=>x.id===id)).filter(Boolean);
        iniciarTorneioComFormato(t, timesObjs);
        await saveTorneio(t);
        toast('Torneio iniciado!');
        render();
      };
      actions.appendChild(genBtn);
    } else {
      const reopenBtn = h(`<button class="btn btn-ghost">↺ Reabrir inscrições</button>`);
      reopenBtn.onclick = async ()=>{
        if(!confirm('Reabrir inscrições deste campeonato?')) return;
        t.status='aberto'; await saveTorneio(t); toast('Inscrições reabertas'); render();
      };
      actions.appendChild(reopenBtn);
    }
    if(t.status==='andamento'){
      const finBtn = h(`<button class="btn btn-ghost">Marcar torneio como finalizado</button>`);
      finBtn.onclick = async ()=>{ t.status='finalizado'; await saveTorneio(t); render(); };
      actions.appendChild(finBtn);
    }
    const editBtn = h(`<button class="btn btn-ghost">✎ Editar</button>`);
    editBtn.onclick = ()=>{ state._editandoTorneio = !state._editandoTorneio; render(); };
    actions.appendChild(editBtn);
    const delBtn = h(`<button class="btn btn-danger">Excluir torneio</button>`);
    delBtn.onclick = async ()=>{
      if(!confirm('Excluir este torneio?')) return;
      await excluirTorneio(t.id);
      state.torneioAtivo=null; render();
    };
    actions.appendChild(delBtn);
    view.appendChild(actions);

    if(state._editandoTorneio){
      const editCard = h(`<div class="form-box" style="max-width:460px;margin-bottom:24px;"><h3 style="margin-top:0;">Editar campeonato</h3></div>`);
      editCard.appendChild(h(`<div class="field"><label>Nome</label><input id="eNome" value="${t.nome}"/></div>`));
      const eJogoSel = h(`<div class="field"><label>Jogo</label><select id="eJogo">${JOGOS.map(g=>`<option ${g===t.jogo?'selected':''}>${g}</option>`).join('')}</select></div>`);
      editCard.appendChild(eJogoSel);
      const dataVal = t.data_inicio ? new Date(t.data_inicio).toISOString().slice(0,16) : '';
      editCard.appendChild(h(`<div class="field"><label>Data/hora de início (opcional)</label><input id="eData" type="datetime-local" value="${dataVal}"/></div>`));
      editCard.appendChild(h(`<div class="field"><label>Regras / Edital (opcional)</label><textarea id="eRegras" rows="4" style="width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:8px;font-size:14.5px;font-family:inherit;">${t.regras||''}</textarea></div>`));
      const eSalvar = h(`<button class="btn btn-gold" style="width:100%;">Salvar alterações</button>`);
      eSalvar.onclick = async ()=>{
        t.nome = document.getElementById('eNome').value.trim() || t.nome;
        t.jogo = document.getElementById('eJogo').value;
        const dataInput = document.getElementById('eData').value;
        t.data_inicio = dataInput ? new Date(dataInput).toISOString() : null;
        t.regras = document.getElementById('eRegras').value;
        await saveTorneio(t);
        state._editandoTorneio = false;
        toast('Campeonato atualizado!');
        render();
      };
      editCard.appendChild(eSalvar);
      view.appendChild(editCard);
    }
  }

  if(t.formato==='grupos_mata_mata' || (t.grupos&&t.grupos.length)){
    view.appendChild(renderGruposUI(t));
  }
  if(t.formato==='pontos'){
    view.appendChild(renderPontosUI(t));
  }
  if(t.partidas && t.partidas.length && matchesPorFase(t, ['mata_mata','winners','losers','grand_final']).length){
    view.appendChild(h(`<h3>Chaveamento</h3>`));
    view.appendChild(renderBracket(t));
  }
}


function matchesPorFase(t, fases){
  return (t.partidas||[]).filter(m=> fases.includes(m.fase||'mata_mata'));
}

function confirmarPlacar(t, m, sa, sb, totalRounds){
  if(sa===''||sb===''){ toast('Informe o placar'); return false; }
  const allowDraw = m.fase==='grupo' || m.fase==='pontos';
  if(!allowDraw && sa===sb){ toast('Informe um placar válido (sem empate)'); return false; }
  m.scoreA=sa; m.scoreB=sb;
  if(Number(sa)===Number(sb)){
    m.vencedor = null; // empate
  } else {
    const vencedor = Number(sa)>Number(sb) ? m.timeA : m.timeB;
    if(m.fase==='grupo' || m.fase==='pontos'){
      m.vencedor = vencedor;
    } else {
      setVencedor(t.partidas, m, vencedor, totalRounds);
    }
  }
  if(m.fase==='grupo') atualizarTabelaGrupo(t, m);
  return true;
}

function renderMatchCard(t, m, totalRounds){
  const nameA = m.timeA ? m.timeA.nome : (m.timeB===null&&m.timeA===null? 'A definir' : '—');
  const nameB = m.timeB ? m.timeB.nome : (m.timeA===null&&m.timeB===null? 'A definir' : '—');
  const done = m.scoreA!=='' && m.scoreB!=='';
  const editable = state.user && state.user.role==='admin' && m.timeA && m.timeB && !done;
  const matchEl = h(`<div class="match ${done?'decidido':''}">
    <div class="slot ${m.vencedor && m.vencedor.id===(m.timeA&&m.timeA.id) ? 'win':''} ${!m.timeA?'bye':''}">
      <span class="name">${nameA}</span>
      ${editable ? `<input type="number" min="0" data-side="A" value="${m.scoreA}"/>` : (m.timeA? `<span>${m.scoreA!==''?m.scoreA:''}</span>`:'')}
    </div>
    <div class="slot ${m.vencedor && m.vencedor.id===(m.timeB&&m.timeB.id) ? 'win':''} ${!m.timeB?'bye':''}">
      <span class="name">${nameB}</span>
      ${editable ? `<input type="number" min="0" data-side="B" value="${m.scoreB}"/>` : (m.timeB? `<span>${m.scoreB!==''?m.scoreB:''}</span>`:'')}
    </div>
  </div>`);
  if(editable){
    matchEl.appendChild(h(`<button class="btn btn-ghost" style="width:100%;border-radius:0 0 12px 12px;font-size:12px;padding:6px;">Confirmar resultado</button>`));
    matchEl.lastElementChild.onclick = async ()=>{
      const sa = matchEl.querySelector('[data-side="A"]').value;
      const sb = matchEl.querySelector('[data-side="B"]').value;
      if(!confirmarPlacar(t, m, sa, sb, totalRounds)) return;
      await saveTorneio(t);
      toast('Resultado salvo');
      render();
    };
  }
  return matchEl;
}

function renderBracket(t){
  const knockout = matchesPorFase(t, ['mata_mata','winners','losers','grand_final']);
  if(!knockout.length) return h('<div class="empty">Sem chaveamento ainda.</div>');
  const rounds = knockout.map(m=>m.round);
  const totalRounds = Math.max(...rounds) + 1;
  // group by fase for double elim
  const fases = [];
  if(knockout.some(m=>m.fase==='winners'||m.fase==='mata_mata'||!m.fase)) fases.push({key:['mata_mata','winners'], title:'Chave principal'});
  if(knockout.some(m=>m.fase==='losers')) fases.push({key:['losers'], title:'Repescagem (perdedores)'});
  if(knockout.some(m=>m.fase==='grand_final')) fases.push({key:['grand_final'], title:'Grande final'});

  const outer = h('<div></div>');
  fases.forEach(f=>{
    const subset = knockout.filter(m=>f.key.includes(m.fase||'mata_mata'));
    if(!subset.length) return;
    if(fases.length>1) outer.appendChild(h(`<h3 style="margin:18px 0 10px;">${f.title}</h3>`));
    const wrap = h(`<div class="bracket"></div>`);
    const maxR = Math.max(...subset.map(m=>m.round));
    const roundNames = (r)=>{
      const left = maxR - r + 1;
      if(f.key.includes('grand_final')) return 'Grande final';
      if(left===1) return 'Final';
      if(left===2) return 'Semifinal';
      if(left===3) return 'Quartas';
      return 'Rodada '+(r+1);
    };
    for(let r=0;r<=maxR;r++){
      const col = h(`<div class="round-col"><div class="round-title">${roundNames(r)}</div></div>`);
      const matchesRound = subset.filter(m=>m.round===r).sort((a,b)=>a.pos-b.pos);
      const isLast = r===maxR;
      let pairContainer = null;
      matchesRound.forEach((m,idx)=>{
        const matchEl = renderMatchCard(t, m, totalRounds);
        if(isLast || matchesRound.length===1){
          col.appendChild(matchEl);
        } else {
          if(idx%2===0){
            pairContainer = h('<div class="pair"></div>');
            col.appendChild(pairContainer);
          }
          pairContainer.appendChild(matchEl);
        }
      });
      wrap.appendChild(col);
    }
    outer.appendChild(wrap);
  });
  return outer;
}

function renderGruposUI(t){
  const wrap = h('<div></div>');
  if(!t.grupos || !t.grupos.length) return wrap;
  wrap.appendChild(h(`<h3>Fase de grupos</h3>`));

    const allDone = groupMatches.every(m=>m.scoreA!==''&&m.scoreB!=='');
    const btn = h(`<button class="btn btn-gold" style="margin-bottom:24px;">Gerar mata-mata com classificados</button>`);
    btn.disabled = !allDone;
    if(!allDone) btn.title = 'Finalize todos os jogos dos grupos primeiro';
    btn.onclick = async ()=>{
      const adv = classificadosDosGrupos(t);
      if(adv.length<2){ toast('Poucos classificados'); return; }
      const bracket = gerarChaveamento(adv);
      t.partidas = [...groupMatches, ...bracket];
      await saveTorneio(t);
      toast('Mata-mata gerado!');
      render();
    };
    wrap.appendChild(btn);
  }
  return wrap;
}

function renderPontosUI(t){
  const matches = matchesPorFase(t, ['pontos']);
  if(!matches.length) return h('');
  const wrap = h('<div></div>');
  // standings
  const stats = {};
  (t.times||[]).forEach(id=>{
    const tm = state.times.find(x=>x.id===id);
    if(tm) stats[id] = {id, nome:tm.nome, j:0,v:0,e:0,d:0,gp:0,gc:0,pts:0};
  });
  matches.forEach(m=>{
    if(m.scoreA===''||m.scoreB==='') return;
    const a = stats[m.timeA&&m.timeA.id], b = stats[m.timeB&&m.timeB.id];
    if(!a||!b) return;
    const x=Number(m.scoreA), y=Number(m.scoreB);
    a.j++;b.j++;a.gp+=x;a.gc+=y;b.gp+=y;b.gc+=x;
    if(x>y){a.v++;b.d++;a.pts+=3;} else if(y>x){b.v++;a.d++;b.pts+=3;} else {a.e++;b.e++;a.pts++;b.pts++;}
  });
  const rows = Object.values(stats).sort((a,b)=>b.pts-a.pts||(b.gp-b.gc)-(a.gp-a.gc)||b.gp-a.gp);
  wrap.appendChild(h(`<h3>Tabela</h3>`));
  const table = h(`<table><thead><tr><th>#</th><th>Time</th><th>J</th><th>V</th><th>E</th><th>D</th><th>SG</th><th>Pts</th></tr></thead><tbody></tbody></table>`);
  const tb = table.querySelector('tbody');
  rows.forEach((r,i)=> tb.appendChild(h(`<tr><td>${i+1}</td><td>${r.nome}</td><td>${r.j}</td><td>${r.v}</td><td>${r.e}</td><td>${r.d}</td><td>${r.gp-r.gc}</td><td><b>${r.pts}</b></td></tr>`)));
  const tw = h('<div class="table-wrap" style="margin-bottom:20px;"></div>');
  tw.appendChild(table);
  wrap.appendChild(tw);
  wrap.appendChild(h(`<h3>Jogos</h3>`));
  const list = h('<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(220px,1fr));margin-bottom:20px;"></div>');
  matches.forEach(m=> list.appendChild(renderMatchCard(t, m, 1)));
  wrap.appendChild(list);
  return wrap;
}

function maybeShowMinigame(){
  if(state.minigameShown) return;
  if(!state.user) return; // só logado acumula pontos
  // ~22% de chance por visita à home nesta sessão
  if(Math.random() > 0.22) return;
  state.minigameShown = true;
  setTimeout(()=> openMinigame(), 700);
}

function openMinigame(){
  if(document.getElementById('mgOverlay')) return;
  const overlay = h(`<div class="mg-overlay" id="mgOverlay"></div>`);
  const modal = h(`<div class="mg-modal"></div>`);
  modal.appendChild(h(`<h3>Mini-game</h3>`));
  modal.appendChild(h(`<p class="muted" style="margin:0 0 4px;">Reação rápida: espere ficar verde e clique.</p>`));
  modal.appendChild(h(`<p class="muted" style="margin:0;font-size:12.5px;">Acerte e ganhe <b style="color:var(--gold)">+15 pts</b></p>`));

  const arena = h(`<div class="mg-arena"><b>Clique para começar</b></div>`);
  let phase = 'idle'; // idle | wait | go | done
  let timer = null;
  let t0 = 0;

  const finish = (ok, ms)=>{
    phase = 'done';
    clearTimeout(timer);
    if(ok){
      arena.className = 'mg-arena ready';
      arena.innerHTML = `<b>Boa! ${ms}ms</b>`;
      setTimeout(async ()=>{
        await addPontos(15, 'Mini-game');
        closeMg();
      }, 700);
    } else {
      arena.className = 'mg-arena fail';
      arena.innerHTML = `<b>Cedo demais!</b>`;
      setTimeout(()=> closeMg(), 900);
    }
  };

  arena.onclick = ()=>{
    if(phase==='idle'){
      phase = 'wait';
      arena.className = 'mg-arena';
      arena.innerHTML = `<b>Espere o verde…</b>`;
      const delay = 1200 + Math.random()*2200;
      timer = setTimeout(()=>{
        phase = 'go';
        t0 = performance.now();
        arena.className = 'mg-arena go';
        arena.innerHTML = `<b>AGORA!</b>`;
      }, delay);
      return;
    }
    if(phase==='wait'){
      finish(false, 0);
      return;
    }
    if(phase==='go'){
      const ms = Math.round(performance.now()-t0);
      finish(true, ms);
    }
  };

  const skip = h(`<button class="btn btn-ghost" style="margin-top:8px;">Agora não</button>`);
  skip.onclick = ()=> closeMg();
  modal.appendChild(arena);
  modal.appendChild(skip);
  overlay.appendChild(modal);
  overlay.addEventListener('click', e=>{ if(e.target===overlay) closeMg(); });
  document.body.appendChild(overlay);
  document.body.style.overflow = 'hidden';

  function closeMg(){
    clearTimeout(timer);
    overlay.remove();
    document.body.style.overflow = '';
  }
}

  if(w.step<4){

      if(w.step===1 && !w.nome.trim()){ toast('Dê um nome ao campeonato'); return; }

  } else {
    const create = h(`<button class="btn btn-gold">Criar campeonato</button>`);
    create.onclick = ()=> criarDoWizard(w);
    nav.appendChild(create);
  }
  box.appendChild(nav);
  view.appendChild(box);
}

function saveWizardFields(w){
  const nome = document.getElementById('wNome');
  if(nome) w.nome = nome.value;
  const jogo = document.getElementById('wJogo');
  if(jogo) w.jogo = jogo.value;
  const data = document.getElementById('wData');
  if(data) w.data_inicio = data.value;
  const regras = document.getElementById('wRegras');
  if(regras) w.regras = regras.value;
  const g = document.getElementById('wGrupos');
  if(g) w.numGrupos = Number(g.value);
  const c = document.getElementById('wClass');
  if(c) w.classificadosPorGrupo = Number(c.value);
  const ida = document.getElementById('wIda');
  if(ida) w.idaVolta = ida.checked;
  const open = document.getElementById('wOpen');
  if(open) w.inscricaoAberta = open.checked;
  const novos = document.getElementById('wNovos');
  if(novos) w.novosNomes = novos.value;
  const wMax = document.getElementById('wMax');
  if(wMax) w.maxInscritos = Number(wMax.value)||0;
  const wNotas = document.getElementById('wNotas');
  if(wNotas) w.notasFormato = wNotas.value;
  return true;
}

async function criarDoWizard(w){
  saveWizardFields(w);
  if(!w.nome.trim()){ toast('Dê um nome ao campeonato'); return; }
  const manuais = (w.novosNomes||'').split('\n').map(s=>s.trim()).filter(Boolean);
  // create manual times
  const timeIds = [...w.selectedTimes];
  for(const nome of manuais){
    const { data, error } = await db.from('times').insert({nome, jogo:w.jogo, jogadores:[], dono: state.user.id}).select().single();
    if(error){ console.error(error); toast('Erro ao criar participante '+nome); return; }
    timeIds.push(data.id);
  }
  if(timeIds.length < 2 && !w.inscricaoAberta){
    toast('Precisa de pelo menos 2 participantes ou inscrições abertas');
    return;
  }
  await loadTimes();

  const payload = {
    nome: w.nome.trim(),
    jogo: w.jogo,
    data_inicio: w.data_inicio ? new Date(w.data_inicio).toISOString() : null,
    regras: [w.regras||'', w.notasFormato ? ('\n\n— Notas do formato —\n'+w.notasFormato) : ''].join('').trim(),
    status: w.inscricaoAberta ? 'aberto' : 'aberto',
    times: timeIds,
    formato: w.formato,
    config: {
      numGrupos: w.numGrupos,
      classificadosPorGrupo: w.classificadosPorGrupo,
      idaVolta: w.idaVolta,
      maxInscritos: w.maxInscritos||0,
      notasFormato: w.notasFormato||''
    },
    grupos: null,
    partidas: null
  };

  // se não quer inscrição aberta e já tem times, pode iniciar já
  const created = await criarTorneio(payload);
  if(!created) return;
  await loadTorneios();

  if(!w.inscricaoAberta && timeIds.length>=2){
    const t = state.torneios.slice().reverse().find(x=>x.nome===payload.nome && x.jogo===payload.jogo);
    if(t){
      t.formato = payload.formato;
      t.config = payload.config;
      t.times = timeIds;
      const timesObjs = timeIds.map(id=>state.times.find(x=>x.id===id)).filter(Boolean);
      iniciarTorneioComFormato(t, timesObjs);
      await saveTorneio(t);
    }
  }

  state.wizard = null;
  state.adminTab = 'lista';
  toast('Campeonato criado!');
  render();
}

function renderAdminLista(view){
  view.appendChild(h(`<div class="section-title"><h1 style="font-size:32px;margin:0;">Campeonatos</h1>
    <button class="btn btn-gold" id="adminNewBtn">Novo</button></div>`));
  document.getElementById('adminNewBtn').onclick = ()=>{ state.adminTab='criar'; state.wizard=null; render(); };

  const statusLabel = {aberto:'Inscrições abertas', andamento:'Em andamento', finalizado:'Finalizado'};
  const fmtLabel = {mata_mata:'Mata-mata', grupos_mata_mata:'Grupos + MM', pontos:'Pontos', dupla_eliminacao:'Dupla elim.', livre:'Livre'};

  if(!state.torneios.length){
    view.appendChild(h(`<div class="empty">Nenhum campeonato criado ainda.</div>`));
    return;
  }
  const table = h(`<table><thead><tr><th>Nome</th><th>Jogo</th><th>Formato</th><th>Status</th><th>Times</th><th>Ações</th></tr></thead><tbody></tbody></table>`);
  const tbody = table.querySelector('tbody');
  state.torneios.forEach(t=>{
    const tr = h(`<tr>
      <td>${t.nome}</td>
      <td>${t.jogo}</td>
      <td>${fmtLabel[t.formato]||'Mata-mata'}</td>
      <td><span class="tag status-${t.status}" style="margin:0;">${statusLabel[t.status]}</span></td>
      <td>${(t.times||[]).length}</td>
    </tr>`);
    const acoesTd = h(`<td></td>`);
    const wrapBtns = h(`<div style="display:flex;gap:6px;flex-wrap:wrap;"></div>`);
    const openBtn = h(`<button class="btn btn-ghost" style="padding:6px 12px;font-size:12.5px;">Abrir</button>`);
    openBtn.onclick = ()=>{ state.tab='torneios'; state.torneioAtivo=t.id; render(); };
    wrapBtns.appendChild(openBtn);
    if(t.status==='aberto'){
      const genBtn = h(`<button class="btn btn-gold" style="padding:6px 12px;font-size:12.5px;">Iniciar</button>`);
      genBtn.disabled = (t.times||[]).length < 2;
      genBtn.onclick = async ()=>{
        const timesObjs = t.times.map(id=>state.times.find(x=>x.id===id)).filter(Boolean);
        iniciarTorneioComFormato(t, timesObjs);
        await saveTorneio(t);
        toast('Torneio iniciado!');
        render();
      };
      wrapBtns.appendChild(genBtn);
    }
    if(t.status==='andamento'){
      const finBtn = h(`<button class="btn btn-ghost" style="padding:6px 12px;font-size:12.5px;">Finalizar</button>`);
      finBtn.onclick = async ()=>{ t.status='finalizado'; await saveTorneio(t); toast('Finalizado'); render(); };
      wrapBtns.appendChild(finBtn);
    }
    const delBtn = h(`<button class="btn btn-danger" style="padding:6px 12px;font-size:12.5px;">Excluir</button>`);
    delBtn.onclick = async ()=>{
      if(!confirm(`Excluir "${t.nome}"?`)) return;
      await excluirTorneio(t.id);
      toast('Excluído');
      render();
    };
    wrapBtns.appendChild(delBtn);
    acoesTd.appendChild(wrapBtns);
    tr.appendChild(acoesTd);
    tbody.appendChild(tr);
  });
  const wrapTable = h('<div class="table-wrap"></div>');
  wrapTable.appendChild(table);
  view.appendChild(wrapTable);
}

function renderAdminParticipantes(view){
  view.appendChild(h(`<div class="section-title"><h1 style="font-size:32px;margin:0;">Participantes</h1></div>`));
  view.appendChild(h(`<p class="muted" style="margin-top:-8px;margin-bottom:18px;">Todos os times/jogadores cadastrados no site.</p>`));

  // quick add
  const addBox = h(`<div class="form-box" style="max-width:480px;margin-bottom:24px;"><h3 style="margin-top:0;">Adicionar participante</h3></div>`);
  addBox.appendChild(h(`<div class="field"><label>Nome</label><input id="apNome" placeholder="Nome do time ou jogador"/></div>`));
  addBox.appendChild(h(`<div class="field"><label>Jogo</label><select id="apJogo">${JOGOS.map(g=>`<option>${g}</option>`).join('')}</select></div>`));
  const addBtn = h(`<button class="btn btn-gold">Cadastrar</button>`);
  addBtn.onclick = async ()=>{
    const nome = document.getElementById('apNome').value.trim();
    if(!nome){ toast('Digite um nome'); return; }
    const jogo = document.getElementById('apJogo').value;
    const { error } = await db.from('times').insert({nome, jogo, jogadores:[], dono: state.user.id});
    if(error){ toast('Erro ao cadastrar'); return; }
    await loadTimes();
    toast('Participante adicionado');
    render();
  };
  addBox.appendChild(addBtn);
  view.appendChild(addBox);

  if(!state.times.length){
    view.appendChild(h(`<div class="empty">Nenhum participante ainda.</div>`));
    return;
  }
  const table2 = h(`<table><thead><tr><th>Nome</th><th>Jogo</th><th>Ações</th></tr></thead><tbody></tbody></table>`);
  const tbody2 = table2.querySelector('tbody');
  state.times.forEach(tm=>{
    const tr = h(`<tr><td>${tm.nome}</td><td>${tm.jogo}</td></tr>`);
    const acoesTd = h(`<td></td>`);
    const delBtn = h(`<button class="btn btn-danger" style="padding:6px 12px;font-size:12.5px;">Remover</button>`);
    delBtn.onclick = async ()=>{
      if(!confirm(`Remover "${tm.nome}"?`)) return;
      await excluirTime(tm.id);
      toast('Removido');
      render();
    };
    acoesTd.appendChild(delBtn);
    tr.appendChild(acoesTd);
    tbody2.appendChild(tr);
  });
  const wrapTable2 = h('<div class="table-wrap"></div>');
  wrapTable2.appendChild(table2);
  view.appendChild(wrapTable2);
}


/* ---- mini tutorial ---- */
const HELP_STEPS = [
  { t:'Bem-vindo ao e-Expedition', d:'Plataforma de campeonatos. Você se inscreve com o nome do perfil e acompanha chaveamentos.' },
  { t:'Criar conta / Entrar', d:'Use o botão Entrar no topo. Dá para criar conta, logar e recuperar senha pelo popup.' },
  { t:'Perfil', d:'Em Perfil você define nome, foto, bio e jogo favorito. Outros jogadores podem ver seu perfil público.' },
  { t:'Campeonatos', d:'Na home filtre Abertos, Acontecendo ou Finalizados. Abra um torneio para se inscrever (1 vez por pessoa).' },
  { t:'Inscrição', d:'Só com inscrição aberta. Confirme com seu nome de exibição. Admin pode remover alguém da lista se precisar.' },
  { t:'ExpdCoin', d:'Pontos ganhos em mini-games e futuros eventos. Sistema de prêmios ainda em fase de teste.' },
  { t:'Admin', d:'Admins criam torneios no wizard: formato (mata-mata, grupos, livre…), participantes e regras próprias.' },
];
let helpIdx = 0;

function renderHelpStep(){
  const box = document.getElementById('helpSteps');
  if(!box) return;
  const s = HELP_STEPS[helpIdx];
  box.innerHTML = `<div class="help-step"><span class="n">${helpIdx+1}</span><div><b>${s.t}</b><div class="muted" style="margin-top:4px;">${s.d}</div></div></div>
    <div class="muted" style="font-size:12px;margin-top:6px;">Passo ${helpIdx+1} de ${HELP_STEPS.length}</div>`;
  document.getElementById('helpPrev').disabled = helpIdx===0;
  document.getElementById('helpNext').textContent = helpIdx===HELP_STEPS.length-1 ? 'Fechar' : 'Próximo';
}

function bindHelp(){
  const fab = document.getElementById('helpFab');
  const panel = document.getElementById('helpPanel');
  if(!fab || fab._bound) return;
  fab._bound = true;
  fab.onclick = ()=>{
    const open = panel.hidden;
    panel.hidden = !open;
    if(open){ helpIdx = 0; renderHelpStep(); }
  };
  document.getElementById('helpPrev').onclick = ()=>{ if(helpIdx>0){ helpIdx--; renderHelpStep(); } };
  document.getElementById('helpNext').onclick = ()=>{
    if(helpIdx < HELP_STEPS.length-1){ helpIdx++; renderHelpStep(); }
    else panel.hidden = true;
  };
}

/* ================= boot ================= */
(async function boot(){
  const view = document.getElementById('view');
  view.innerHTML = '<div class="empty">Carregando…</div>';
  try{
    if(!window.supabase){
      throw new Error('A biblioteca do Supabase não carregou. Verifique sua conexão ou desative bloqueadores de anúncio/rastreador para este site e recarregue a página.');
    }
    db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    await loadAll();
    const params = new URLSearchParams(window.location.search);
    const torneioLink = params.get('torneio');
    if(torneioLink && state.torneios.find(x=>x.id===torneioLink)){
      state.torneioAtivo = torneioLink;
    }
    setupScrollEffects();
    bindAuthModal();
    bindHelp();
    render();
    // popup de login ao entrar, se não estiver autenticado
    if(!state.user){
      setTimeout(()=> openLoginModal('login'), 350);
    }
    // suporte a recovery de senha (link do e-mail)
    const hash = window.location.hash || '';
    if(hash.includes('type=recovery') || hash.includes('type=signup')){
      // usuário volta do e-mail — deixa logado e manda pro perfil se recovery
      if(hash.includes('type=recovery')){
        state.tab = 'perfil';
        render();
        toast('Defina sua nova senha no e-mail ou atualize seus dados no perfil.');
      }
    }
  }catch(err){
    console.error(err);
    view.innerHTML = '<div class="empty">⚠️ Erro ao carregar o site.<br><br>'+(err && err.message ? err.message : String(err))+'</div>';
  }
})();
